<!DOCTYPE html>
<!--
  THE LIQUID MIRROR
  ─────────────────
  Debug / screenshot hooks (append to the URL):
    ?s=0     fully fogged idle           (default state)
    ?s=1     partially wiped, ~35%       (synthesised organic wipe)
    ?s=2     just-completed burn-off     (warm sweep mid-flight)
    ?s=3     final bloomed payoff        (all copy revealed, petals of light)
    ?still=1 freezes all looping ambient motion at a good-looking frame
             (layout is identical with and without it; one-shot transitions
              such as the burn-off still run so the payoff stays reachable,
              except ?s=2&still=1 which deliberately holds mid-sweep)
  Combine freely, e.g. ?s=2&still=1
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0908">
<title>someone left you a message</title>
<meta property="og:type" content="website">
<meta property="og:title" content="someone left you a message on the mirror">
<meta property="og:description" content="it's a little fogged over. you'll have to wipe it. (best with a finger.)">
<meta name="description" content="it's a little fogged over. you'll have to wipe it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   tokens
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ar: .64;                                  /* glass width / height   */
  --mw: min(78vw, 46vh, 418px);               /* glass width (fallback) */
  --mw: min(78vw, 46dvh, 418px);              /* glass width            */
  --gh: calc(var(--mw) / var(--ar));          /* glass height           */
  --fw: calc(var(--mw) * .038);               /* frame thickness        */
  --rv: 0;                                    /* 0‥1 reveal progress    */

  --serif: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
  --sans:  'Jost', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;

  --pearl: #fff3e6;
  --ink:   rgba(255,236,214,.42);
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:#0b0807;
}
body{
  font-family:var(--sans);
  color:var(--pearl);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

/* ═══════════════════════════════════════════════════════════════
   the room
   ═══════════════════════════════════════════════════════════════ */
#room{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(110% 78% at 50% 44%, rgba(92,56,32,.30) 0%, rgba(92,56,32,0) 62%),
    radial-gradient(140% 60% at 50% 112%, rgba(126,72,38,.20) 0%, rgba(126,72,38,0) 68%),
    radial-gradient(90% 70% at 50% -12%, rgba(58,40,34,.42) 0%, rgba(58,40,34,0) 64%),
    linear-gradient(178deg, #14100e 0%, #191310 38%, #100c0a 72%, #080605 100%);
}
/* faint warm rim-light down both walls */
#room::before,#room::after{
  content:''; position:absolute; top:0; bottom:0; width:26vw; pointer-events:none;
}
#room::before{ left:0;  background:linear-gradient(90deg, rgba(255,168,92,.075), rgba(255,168,92,0) 78%); }
#room::after { right:0; background:linear-gradient(270deg, rgba(255,150,96,.055), rgba(255,150,96,0) 78%); }

/* room warms up as the message is uncovered */
#warm{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(70% 55% at 50% 48%, rgba(255,176,110,.30) 0%, rgba(255,150,90,.10) 42%, rgba(255,140,80,0) 72%),
    radial-gradient(120% 46% at 50% 108%, rgba(255,150,84,.16), rgba(255,150,84,0) 70%);
  opacity:calc(var(--rv) * .55);
  transition:opacity .45s linear;
  mix-blend-mode:screen;
  transform:translateZ(0);
}

/* dust motes + petals of light */
#air{
  position:fixed; inset:0; z-index:6; pointer-events:none;
  mix-blend-mode:screen;
  /* own compositing layer: this canvas repaints every frame and blends over the
     whole page, so let the compositor keep it separate from the scene tiles */
  transform:translateZ(0);
}

/* film grain */
#grain{
  position:fixed; inset:-60px; z-index:7; pointer-events:none;
  opacity:.045; mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.86' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='170' height='170' filter='url(%23n)'/></svg>");
  background-size:170px 170px;
  animation:grain 1.1s steps(1,end) infinite;
}
@keyframes grain{
  0%  { transform:translate3d(0,0,0) }
  12% { transform:translate3d(-9px,4px,0) }
  25% { transform:translate3d(6px,-8px,0) }
  37% { transform:translate3d(-4px,-3px,0) }
  50% { transform:translate3d(8px,7px,0) }
  62% { transform:translate3d(-7px,9px,0) }
  75% { transform:translate3d(3px,-6px,0) }
  87% { transform:translate3d(-10px,-2px,0) }
  100%{ transform:translate3d(0,0,0) }
}

/* ═══════════════════════════════════════════════════════════════
   layout
   ═══════════════════════════════════════════════════════════════ */
#app{
  position:fixed; left:0; right:0; top:0;
  height:100vh; height:100dvh;
  z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(12px,2.6vh,28px);
  padding:calc(env(safe-area-inset-top,0px) + 10px)
          calc(env(safe-area-inset-right,0px) + 10px)
          calc(env(safe-area-inset-bottom,0px) + 10px)
          calc(env(safe-area-inset-left,0px) + 10px);
}

#stage{ position:relative; flex:0 0 auto; }

/* the mirror's light spilling into the room */
#spill{
  position:absolute; left:50%; top:50%; z-index:0; pointer-events:none;
  width:calc(var(--mw) * 2.5); height:calc(var(--gh) * 1.85);
  background:
    radial-gradient(48% 46% at 50% 50%, rgba(255,206,158,.34) 0%, rgba(255,178,120,.13) 38%, rgba(255,160,100,0) 70%),
    radial-gradient(30% 30% at 50% 50%, rgba(150,240,255,.10) 0%, rgba(150,240,255,0) 70%);
  transform:translate(-50%,-50%) scale(calc(.82 + var(--rv) * .3));
  opacity:calc(.16 + var(--rv) * .84);
  transition:opacity .5s linear, transform .8s cubic-bezier(.22,.7,.3,1);
  mix-blend-mode:screen;
  will-change:opacity,transform;
}
/* soft pool of light on the floor beneath the mirror */
#floor{
  position:absolute; left:50%; z-index:0; pointer-events:none;
  top:calc(100% + var(--mw) * .04);
  width:calc(var(--mw) * 1.5); height:calc(var(--mw) * .30);
  transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 42%, rgba(255,196,142,.30), rgba(255,170,110,0) 72%);
  filter:blur(11px);
  opacity:calc(.10 + var(--rv) * .6);
  transition:opacity .5s linear;
  mix-blend-mode:screen;
  will-change:opacity;
}

/* ── frame ─────────────────────────────────────────────────── */
.frame{
  position:relative; z-index:2;
  width:calc(var(--mw) + var(--fw) * 2);
  height:calc(var(--gh) + var(--fw) * 2);
  padding:var(--fw);
  border-radius:50%;
  background:
    conic-gradient(from 202deg at 50% 50%,
      #241b15   0deg,  #403124  10deg, #6b543e  26deg, #a98d67  42deg,
      #d8c096   54deg, #f0dcb8  62deg, #b99c74  74deg, #6d573f  96deg,
      #35281e  126deg, #241b15 152deg, #3d2f23 176deg, #574433 190deg,
      #7c6347  206deg, #c4a97f 226deg, #e7d3ac 236deg, #a98d67 250deg,
      #5e4a36  278deg, #2e231a 312deg, #241b15 340deg, #241b15 360deg);
  box-shadow:
    0 44px 96px rgba(0,0,0,.78),
    0 10px 30px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,226,188,.07),
    inset 0 1px 1px rgba(255,238,206,.30),
    inset 0 -2px 3px rgba(0,0,0,.62);
}
/* warm rim glow, grows on bloom */
.frame::after{
  content:''; position:absolute; inset:calc(var(--fw) * -.6);
  border-radius:50%; pointer-events:none;
  box-shadow:0 0 calc(28px + var(--rv) * 62px) calc(var(--rv) * 7px) rgba(255,182,112,calc(.06 + var(--rv) * .34));
  transition:box-shadow .5s linear;
}

/* ── glass ─────────────────────────────────────────────────── */
#glass{
  position:relative; width:100%; height:100%;
  border-radius:50%; overflow:hidden; isolation:isolate;
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><circle cx='17' cy='17' r='12' fill='rgba(255,246,232,0.10)' stroke='rgba(255,246,232,0.55)' stroke-width='1'/><circle cx='17' cy='17' r='1.6' fill='rgba(255,246,232,0.6)'/></svg>") 17 17, grab;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.9),
    0 0 0 2px rgba(255,232,198,.13),
    inset 0 3px 12px rgba(0,0,0,.85),
    inset 0 -4px 18px rgba(0,0,0,.75);
}
/* every layer fills the glass; the glass itself is the only hit target */
#glass > *{ position:absolute; inset:0; pointer-events:none; }

/* dark mirror base */
.base{
  background:
    linear-gradient(104deg, rgba(255,255,255,0) 26%, rgba(255,255,255,.035) 43%, rgba(255,255,255,0) 60%),
    radial-gradient(120% 96% at 46% 26%, #211814 0%, #150f0d 46%, #0a0706 78%, #060404 100%);
}

/* iridescent liquid colour-field (canvas, upscaled).
   NOTE: the glass is luminous from the very first stroke — what grows with
   --rv is the *area* she has uncovered and the light spilling into the room,
   never the brightness of the glass itself. Dimming the glass by progress
   made a half-wiped mirror read as smeared grease instead of liquid pearl. */
#iri{
  width:100%; height:100%;
  mix-blend-mode:screen;
  opacity:calc(.88 + var(--rv) * .12);
  transition:opacity .5s linear;
}

/* soap-film interference bands */
#glass .bands{
  inset:-30%;
  background:
    repeating-radial-gradient(ellipse 74% 58% at 34% 24%,
      rgba(255,255,255,0)    0%,
      rgba(214,255,246,.075) 2.4%,
      rgba(255,255,255,0)    5.6%,
      rgba(255,255,255,0)    7.4%,
      rgba(226,206,255,.06)  9.6%,
      rgba(255,255,255,0)    12.8%);
  mix-blend-mode:screen;
  opacity:calc(.9 + var(--rv) * .1);
  animation:bands 41s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes bands{
  from{ transform:translate3d(-2.5%,1.5%,0) scale(1) rotate(0deg) }
  to  { transform:translate3d(3%,-2.5%,0) scale(1.13) rotate(6deg) }
}

/* oil-on-water streaks */
#glass .slick{
  inset:-45%;
  background:
    linear-gradient(112deg,
      rgba(0,0,0,0)      18%,
      rgba(84,255,224,.10) 30%,
      rgba(150,140,255,.13) 39%,
      rgba(255,132,196,.11) 48%,
      rgba(255,206,140,.10) 56%,
      rgba(0,0,0,0)      70%),
    linear-gradient(56deg,
      rgba(0,0,0,0)      30%,
      rgba(120,230,255,.07) 45%,
      rgba(255,160,220,.06) 55%,
      rgba(0,0,0,0)      68%);
  mix-blend-mode:screen;
  opacity:calc(.9 + var(--rv) * .1);
  animation:slick 57s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes slick{
  from{ transform:translate3d(-7%,4%,0) rotate(-4deg) }
  to  { transform:translate3d(7%,-5%,0) rotate(5deg) }
}

/* inner vignette keeps the glass edge deep + glassy */
.vig{
  background:radial-gradient(74% 62% at 50% 48%,
    rgba(0,0,0,0) 0%, rgba(0,0,0,.12) 56%, rgba(4,2,2,.62) 84%, rgba(2,1,1,.86) 100%);
}

/* Wiped glass is specular where fogged glass is diffuse: this warm pearl sheen
   sits *under* the fog, so it is only ever visible inside the patches she has
   actually cleared, and it fades to zero as the last of the fog burns off. */
.gleam{
  background:
    radial-gradient(74% 56% at 50% 44%, rgba(255,232,202,.58) 0%, rgba(255,198,152,.26) 48%, rgba(255,180,130,0) 82%),
    radial-gradient(96% 86% at 44% 66%, rgba(96,232,244,.30) 0%, rgba(150,140,255,.20) 44%, rgba(210,120,210,.10) 70%, rgba(190,130,220,0) 88%);
  mix-blend-mode:screen;
  opacity:calc((1 - var(--rv)) * .46);
  transition:opacity .5s linear;
}

/* glow behind the message */
.tglow{
  background:radial-gradient(46% 27% at 50% 47%,
    rgba(255,214,168,.55) 0%, rgba(255,180,120,.20) 42%, rgba(255,170,110,0) 74%);
  mix-blend-mode:screen;
  opacity:calc(.62 + var(--rv) * .28);
  transition:opacity .5s linear;
}

/* ── the message ───────────────────────────────────────────── */
#reveal{
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  padding:0 4%;
  font-family:var(--serif);
  /* belt-and-braces on top of the thicker fog: unreadable until she touches
     it. One raster change on first contact, then never again. */
  filter:blur(9px);
  transition:filter .45s ease;
}
html.wiped #reveal{ filter:none; }
.l1{
  font-size:calc(var(--mw) * .105); font-weight:300; font-style:italic;
  line-height:1.05; letter-spacing:.04em; color:#f6e6d6; opacity:.93;
  text-shadow:0 0 22px rgba(255,190,140,.28);
}
.l2{
  font-size:calc(var(--mw) * .17); font-weight:500; font-style:italic;
  line-height:.98; letter-spacing:-.005em; color:#ffd7bd;
  margin-top:calc(var(--mw) * .006);
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .l2{
    background:linear-gradient(100deg,#8df0e2 0%,#a8c6ff 18%,#d7a6ff 34%,#ffa4d2 52%,#ffd49a 70%,#8df0e2 100%);
    background-size:280% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:shimmer 11s linear infinite;
  }
}
@keyframes shimmer{ from{ background-position:0% 0 } to{ background-position:280% 0 } }
.l3{
  font-size:calc(var(--mw) * .185); font-weight:400; font-style:italic;
  line-height:.98; letter-spacing:-.008em; color:#fff5ea;
  margin-top:calc(var(--mw) * .012);
  text-shadow:0 0 26px rgba(255,196,144,.34), 0 0 68px rgba(255,152,92,.20);
}

.p2{
  font-size:calc(var(--mw) * .082); font-weight:300; font-style:italic;
  line-height:1.2; color:#f7e3d2; opacity:0;
  margin-top:calc(var(--mw) * .075);
  transform:translateY(9px);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.3,1);
  transition-delay:.45s;
  text-shadow:0 0 20px rgba(255,190,140,.26);
}
.p3{
  font-family:var(--serif);
  font-size:max(10px, calc(var(--mw) * .0315)); font-weight:300; font-style:italic;
  line-height:1.75; letter-spacing:.07em; color:#f3ded0; opacity:0;
  max-width:86%;
  margin-top:calc(var(--mw) * .052);
  transform:translateY(7px);
  transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.3,1);
  transition-delay:1.15s;
}
.sig{
  font-family:var(--sans);
  font-size:max(9px, calc(var(--mw) * .026)); font-weight:300;
  letter-spacing:.42em; text-indent:.42em; text-transform:uppercase;
  color:rgba(255,224,198,.5); opacity:0;
  margin-top:calc(var(--mw) * .048);
  transition:opacity 1.3s ease;
  transition-delay:1.75s;
}
.bloomed .p2,.bloomed .p3{ opacity:1; transform:none; }
.bloomed .p3{ opacity:.62; }
.bloomed .sig{ opacity:1; }

/* ── specular sweep across the glass ───────────────────────── */
.sheen{
  pointer-events:none;
  background:linear-gradient(104deg,
    rgba(255,255,255,0) 38%,
    rgba(255,252,246,.07) 45%,
    rgba(255,255,255,.19) 50%,
    rgba(255,250,242,.07) 55%,
    rgba(255,255,255,0) 62%);
  mix-blend-mode:screen;
  animation:sheen 11s cubic-bezier(.55,0,.45,1) infinite;
  will-change:transform;
}
@keyframes sheen{
  0%,   8% { transform:translate3d(-135%,0,0) }
  58%,100% { transform:translate3d(135%,0,0) }
}

/* ── fog + water ───────────────────────────────────────────── */
#fog,#drops{ width:100%; height:100%; pointer-events:none; }

#rips{ pointer-events:none; overflow:hidden; }
.rip{
  position:absolute; border-radius:50%; pointer-events:none;
  mix-blend-mode:screen;
  background:radial-gradient(circle,
    rgba(255,255,255,0) 46%,
    rgba(150,255,236,.30) 55%,
    rgba(196,168,255,.34) 62%,
    rgba(255,176,214,.26) 69%,
    rgba(255,214,150,.14) 76%,
    rgba(255,255,255,0) 84%);
  animation:rip 1150ms cubic-bezier(.16,.7,.3,1) forwards;
  will-change:transform,opacity;
}
@keyframes rip{
  from{ transform:scale(.18); opacity:.0 }
  14% { opacity:.85 }
  to  { transform:scale(1); opacity:0 }
}

/* ── etched instruction ────────────────────────────────────── */
#etch{
  inset:auto 0 auto 0;
  top:calc(var(--mw) * .19);
  height:auto;
  text-align:center; pointer-events:none;
  padding:0 12%;
  opacity:calc(1 - var(--rv) * 2.4);
  transition:opacity .3s linear;
}
#etch span{
  display:block;
  font-family:var(--sans);
  font-size:max(10px, calc(var(--mw) * .029));
  font-weight:400; text-transform:uppercase;
  letter-spacing:.2em; text-indent:.2em;
  line-height:1.65;
  color:rgba(74,80,88,.82);
  text-shadow:0 1px 0 rgba(255,255,255,.72);
}
#etch #etch2{
  color:rgba(52,58,66,.9);
  margin-top:.35em;
  animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{ 0%,100%{ opacity:.62 } 50%{ opacity:1 } }

/* ── ghost finger hint ─────────────────────────────────────── */
#hint{
  pointer-events:none; opacity:0;
  transition:opacity .8s ease;
}
#hint.on{ opacity:1; }
#hint i{
  position:absolute; left:50%; top:52%;
  width:calc(var(--mw) * .17); height:calc(var(--mw) * .17);
  margin-left:calc(var(--mw) * -.085); margin-top:calc(var(--mw) * -.085);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,244,228,.22) 34%, rgba(255,236,210,0) 68%);
  mix-blend-mode:screen;
  animation:ghost 4.6s cubic-bezier(.45,0,.35,1) infinite;
  will-change:transform,opacity;
}
#hint i.t{
  width:calc(var(--mw) * .3); height:calc(var(--mw) * .3);
  margin-left:calc(var(--mw) * -.15); margin-top:calc(var(--mw) * -.15);
  background:radial-gradient(circle, rgba(255,248,236,.16) 0%, rgba(255,240,220,0) 66%);
  animation-delay:.14s;   /* the smear lags a beat behind the fingertip */
}
@keyframes ghost{
  0%   { transform:translate3d(-92%,26%,0) scale(.6);  opacity:0 }
  14%  { opacity:.95 }
  32%  { transform:translate3d(-30%,-14%,0) scale(1) }
  55%  { transform:translate3d(38%,10%,0) scale(1) }
  74%  { transform:translate3d(92%,-18%,0) scale(.85); opacity:.55 }
  86%,100%{ transform:translate3d(112%,-26%,0) scale(.6); opacity:0 }
}

/* ── warm burn-off sweep ───────────────────────────────────── */
#burn{
  pointer-events:none; opacity:0;
  background:linear-gradient(98deg,
    rgba(255,214,160,0) 30%,
    rgba(255,226,186,.34) 41%,
    rgba(255,242,220,.80) 48%,
    rgba(255,196,132,.42) 55%,
    rgba(255,170,104,0) 66%);
  mix-blend-mode:screen;
  will-change:transform,opacity;
}

/* ── footer ────────────────────────────────────────────────── */
#foot{
  flex:0 0 auto; z-index:4;
  min-height:26px; display:flex; align-items:center; justify-content:center;
}
#reset{
  font-family:var(--sans); font-size:11px; font-weight:400;
  letter-spacing:.26em; text-indent:.26em; text-transform:uppercase;
  color:var(--ink); background:none; border:0;
  border-bottom:1px solid rgba(255,226,196,.16);
  padding:0 2px 4px; cursor:pointer;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .8s ease, color .35s ease, border-color .35s ease, visibility 0s linear .8s;
}
#reset.show{ opacity:1; visibility:visible; pointer-events:auto; transition-delay:0s; }
#reset:hover,#reset:focus-visible{ color:rgba(255,236,214,.9); border-color:rgba(255,226,196,.42); outline:none; }
#reset:focus-visible{ box-shadow:0 0 0 2px rgba(255,206,158,.28); border-radius:3px; }

/* ═══════════════════════════════════════════════════════════════
   reduced motion — keep the wipe + the whole payoff, calm the rest
   ═══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce){
  #grain,.bands,.slick,.l2{ animation:none !important; }
  .sheen{ animation-duration:34s; }
  #hint i{ animation-duration:8s; }
  #spill,#floor,#warm{ transition-duration:.8s; }
}
html.rm #grain,html.rm .bands,html.rm .slick,html.rm .l2{ animation:none !important; }
html.rm .sheen{ animation-duration:34s; }

/* ═══════════════════════════════════════════════════════════════
   ?still=1 — freeze ambient motion at a chosen frame
   ═══════════════════════════════════════════════════════════════ */
html.still *,html.still *::before,html.still *::after{ animation-play-state:paused !important; }
html.still .sheen { animation-delay:-5.4s; }
html.still .bands { animation-delay:-15s; }
html.still .slick { animation-delay:-23s; }
html.still .l2    { animation-delay:-3.2s; }
html.still #etch2 { animation-delay:-1.7s; opacity:1; }
html.still #grain { animation-delay:-.34s; }
html.still #hint  { display:none; }

[hidden]{ display:none !important; }
</style>
</head>
<body>

<div id="room"></div>
<div id="warm"></div>

<div id="app">
  <div id="stage">
    <div id="spill"></div>
    <div id="floor"></div>

    <div class="frame">
      <div id="glass">
        <div class="base"></div>
        <canvas id="iri"></canvas>
        <div class="bands"></div>
        <div class="slick"></div>
        <div class="vig"></div>
        <div class="gleam"></div>
        <div class="tglow"></div>

        <div id="reveal">
          <div class="l1">you are</div>
          <div class="l2">soooo</div>
          <div class="l3">beautiful</div>
          <div class="p2" id="p2">and i mean it.</div>
          <div class="p3" id="p3">—&nbsp;from 8,000&nbsp;km away, still can’t stop looking.</div>
          <div class="sig" id="sig"></div>
        </div>

        <canvas id="fog"></canvas>
        <canvas id="drops"></canvas>
        <div class="sheen"></div>
        <div id="rips"></div>
        <div id="etch"><span id="etch1">someone left you a message</span><span id="etch2">wipe the mirror</span></div>
        <div id="hint"><i class="t"></i><i></i></div>
        <div id="burn"></div>
      </div>
    </div>
  </div>

  <footer id="foot">
    <button id="reset" type="button">fog it up again</button>
  </footer>
</div>

<canvas id="air"></canvas>
<div id="grain"></div>

<script>
/* ─── customise me ────────────────────────────────────────────── */
const CONFIG = { herName: "", myName: "Amit" };
/* ─────────────────────────────────────────────────────────────── */
(function(){
'use strict';

var doc = document, root = doc.documentElement;
var $ = function(id){ return doc.getElementById(id); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var rand  = function(a,b){ return a + Math.random()*(b-a); };
var TAU = Math.PI*2;

/* ── url hooks ──────────────────────────────────────────────── */
var qs = new URLSearchParams(location.search);
var sRaw = qs.get('s');
var STAGE = (sRaw !== null && sRaw !== '' && isFinite(+sRaw)) ? clamp(parseInt(sRaw,10),0,3) : null;
var STILL = qs.get('still') === '1';
var RM = false;
try { RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
if (STILL) root.classList.add('still');
if (RM)    root.classList.add('rm');

/* ── elements ───────────────────────────────────────────────── */
var glass = $('glass'), fog = $('fog'), drops = $('drops'), iri = $('iri'), air = $('air');
var ripsEl = $('rips'), etchEl = $('etch'), hintEl = $('hint'), burnEl = $('burn');
var stageEl = $('stage'), resetEl = $('reset'), revealEl = $('reveal');
var p2El = $('p2'), p3El = $('p3'), sigEl = $('sig');

var fctx = fog.getContext('2d');
var dctx = drops.getContext('2d');
var ictx = iri.getContext('2d');
var actx = air.getContext('2d');

/* ── copy ───────────────────────────────────────────────────── */
var HER = String(CONFIG.herName || '').trim();
var MY  = String(CONFIG.myName  || '').trim();
$('etch1').textContent = HER ? (HER + ' — someone left you a message') : 'someone left you a message';
p2El.textContent = HER ? ('and i mean it, ' + HER + '.') : 'and i mean it.';
if (MY) { sigEl.textContent = MY; } else { sigEl.hidden = true; }

/* ── geometry state ─────────────────────────────────────────── */
var AR = 0.64;                 /* mirrors --ar */
var gw = 300, gh = 470;        /* glass size, css px */
var dpr = 1;
var cx = 0, cy = 0;            /* mirror centre in viewport px (for motes) */

/* ═══ sprites ═══════════════════════════════════════════════ */
function makeCanvas(w,h){
  var c = doc.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

/* feathered wipe brush */
var BRUSH = (function(){
  var S = 128, c = makeCanvas(S,S), g = c.getContext('2d');
  var gr = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0.00,'rgba(255,255,255,1)');
  gr.addColorStop(0.58,'rgba(255,255,255,1)');
  gr.addColorStop(0.76,'rgba(255,255,255,.94)');
  gr.addColorStop(0.88,'rgba(255,255,255,.56)');
  gr.addColorStop(0.95,'rgba(255,255,255,.18)');
  gr.addColorStop(1.00,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,S,S);
  return c;
})();

/* fog grain tile */
var NOISE = (function(){
  var S = 128, c = makeCanvas(S,S), g = c.getContext('2d');
  var img = g.createImageData(S,S), d = img.data;
  for (var i=0;i<d.length;i+=4){
    var v = 186 + ((Math.random()*70)|0);
    d[i]=v; d[i+1]=v; d[i+2]=v+3; d[i+3]=255;
  }
  g.putImageData(img,0,0);
  return c;
})();

/* soft colour blob for the iridescent field */
function blobSprite(hex){
  var S = 160, c = makeCanvas(S,S), g = c.getContext('2d');
  var gr = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0.00,'rgba('+hex+',.92)');
  gr.addColorStop(0.28,'rgba('+hex+',.62)');
  gr.addColorStop(0.55,'rgba('+hex+',.26)');
  gr.addColorStop(0.78,'rgba('+hex+',.07)');
  gr.addColorStop(1.00,'rgba('+hex+',0)');
  g.fillStyle = gr; g.fillRect(0,0,S,S);
  return c;
}

/* water bead: soft shadow + bright specular */
var BEAD_D = (function(){
  var S = 64, c = makeCanvas(S,S), g = c.getContext('2d');
  var gr = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(10,6,4,.42)');
  gr.addColorStop(.6,'rgba(10,6,4,.20)');
  gr.addColorStop(1,'rgba(10,6,4,0)');
  g.fillStyle = gr; g.fillRect(0,0,S,S);
  return c;
})();
var BEAD_L = (function(){
  var S = 64, c = makeCanvas(S,S), g = c.getContext('2d');
  var gr = g.createRadialGradient(S*.38,S*.34,0,S*.5,S*.5,S*.5);
  gr.addColorStop(0.00,'rgba(255,252,246,.95)');
  gr.addColorStop(0.16,'rgba(255,244,228,.55)');
  gr.addColorStop(0.42,'rgba(220,240,255,.16)');
  gr.addColorStop(1.00,'rgba(200,230,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,S,S);
  return c;
})();

/* dust mote + petal of light */
var MOTE = (function(){
  var S = 32, c = makeCanvas(S,S), g = c.getContext('2d');
  var gr = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'rgba(255,244,226,1)');
  gr.addColorStop(.3,'rgba(255,232,204,.5)');
  gr.addColorStop(1,'rgba(255,220,180,0)');
  g.fillStyle = gr; g.fillRect(0,0,S,S);
  return c;
})();
var PETAL = (function(){
  /* squash a radial into an ellipse that reaches alpha 0 exactly at the
     sprite's edges — otherwise rotating it shows a hard straight cut */
  var W = 160, H = 80, c = makeCanvas(W,H), g = c.getContext('2d');
  g.translate(W/2, H/2);
  g.scale(1, H/W);
  var gr = g.createRadialGradient(0,0,0,0,0,W/2);
  gr.addColorStop(0.00,'rgba(255,238,214,.95)');
  gr.addColorStop(0.20,'rgba(255,214,168,.46)');
  gr.addColorStop(0.46,'rgba(255,180,124,.15)');
  gr.addColorStop(0.72,'rgba(255,168,108,.03)');
  gr.addColorStop(1.00,'rgba(255,160,100,0)');
  g.fillStyle = gr; g.fillRect(-W/2,-W/2,W,W);
  return c;
})();

/* ═══ wipe mask (resolution-independent record of everything erased) ══ */
var MW = 448, MH = Math.round(MW/AR);          /* 448 x 700 */
var mask = makeCanvas(MW,MH), mctx = mask.getContext('2d');

/* ═══ coverage grid (progress without pixel readback) ════════ */
var GX = 34, GY = Math.round(GX/AR);           /* 34 x 53 */
var grid   = new Uint8Array(GX*GY);
var inside = new Uint8Array(GX*GY);
var insideTotal = 0, clearedCells = 0;
(function(){
  for (var y=0;y<GY;y++){
    for (var x=0;x<GX;x++){
      var u = (x+0.5)/GX*2-1, v = (y+0.5)/GY*2-1;
      if (u*u + v*v <= 1){ inside[y*GX+x] = 1; insideTotal++; }
    }
  }
})();
var progress = 0;

function markGrid(x,y,r){
  var ru = (r*0.78)/gw, rv = (r*0.78)/gh;
  var u = x/gw, v = y/gh;
  if (ru <= 0 || rv <= 0) return;
  var x0 = Math.max(0, Math.floor((u-ru)*GX)), x1 = Math.min(GX-1, Math.ceil((u+ru)*GX));
  var y0 = Math.max(0, Math.floor((v-rv)*GY)), y1 = Math.min(GY-1, Math.ceil((v+rv)*GY));
  for (var gy=y0; gy<=y1; gy++){
    for (var gx=x0; gx<=x1; gx++){
      var i = gy*GX+gx;
      if (!inside[i] || grid[i]) continue;
      var du = ((gx+0.5)/GX - u)/ru, dv = ((gy+0.5)/GY - v)/rv;
      if (du*du + dv*dv <= 1){ grid[i] = 1; clearedCells++; }
    }
  }
  progress = insideTotal ? clearedCells/insideTotal : 0;
}
function clearGridAll(){
  for (var i=0;i<grid.length;i++){ if (inside[i] && !grid[i]){ grid[i]=1; clearedCells++; } }
  progress = 1;
}
function resetGrid(){ grid.fill(0); clearedCells = 0; progress = 0; }

function clearedCentroid(){
  var sx=0, sy=0, n=0;
  for (var y=0;y<GY;y++) for (var x=0;x<GX;x++){
    var i=y*GX+x; if (grid[i]){ sx+=(x+0.5)/GX; sy+=(y+0.5)/GY; n++; }
  }
  if (!n) return { x: gw*0.5, y: gh*0.5 };
  return { x: (sx/n)*gw, y: (sy/n)*gh };
}

/* ═══ fog texture ════════════════════════════════════════════ */
var fogTex = null;
function buildFogTexture(w,h,ratio){
  var c = makeCanvas(w*ratio, h*ratio), g = c.getContext('2d');
  g.setTransform(ratio,0,0,ratio,0,0);

  var lin = g.createLinearGradient(0,0,w*0.25,h);
  lin.addColorStop(0.00,'rgba(212,217,224,.945)');
  lin.addColorStop(0.42,'rgba(198,203,210,.955)');
  lin.addColorStop(0.78,'rgba(181,185,192,.95)');
  lin.addColorStop(1.00,'rgba(164,167,175,.94)');
  g.fillStyle = lin; g.fillRect(0,0,w,h);

  /* cloudy condensation drift */
  var i, bg, bx, by, br;
  for (i=0;i<58;i++){
    bx = rand(-w*0.12, w*1.12); by = rand(-h*0.08, h*1.08); br = rand(w*0.12, w*0.46);
    bg = g.createRadialGradient(bx,by,0,bx,by,br);
    var bright = Math.random() < 0.55;
    bg.addColorStop(0, bright ? 'rgba(255,255,255,.075)' : 'rgba(168,174,182,.07)');
    bg.addColorStop(1, bright ? 'rgba(255,255,255,0)'    : 'rgba(168,174,182,0)');
    g.fillStyle = bg; g.beginPath(); g.arc(bx,by,br,0,TAU); g.fill();
  }

  /* the fog falls into shadow toward the rim — seats it into the frame */
  g.save();
  g.translate(w/2,h/2); g.scale(1,h/w);
  var rim = g.createRadialGradient(0,0,w*0.16,0,0,w*0.62);
  rim.addColorStop(0,'rgba(150,155,163,0)');
  rim.addColorStop(0.58,'rgba(132,137,146,.20)');
  rim.addColorStop(0.86,'rgba(88,92,100,.46)');
  rim.addColorStop(1,'rgba(58,60,66,.62)');
  g.fillStyle = rim; g.beginPath(); g.arc(0,0,w*0.64,0,TAU); g.fill();
  g.restore();
  /* The condensation is thickest right over the message, so the type is only
     an illegible shimmer until she wipes. Same hue as the surrounding fog —
     this adds opacity, not a bright spot — and it costs nothing at wipe time
     because it lives in the texture rather than over the revealed glass. */
  var dens = g.createRadialGradient(w*0.5,h*0.46,0,w*0.5,h*0.46,w*0.78);
  dens.addColorStop(0.00,'rgba(199,204,211,.44)');
  dens.addColorStop(0.42,'rgba(197,202,209,.32)');
  dens.addColorStop(0.74,'rgba(193,198,205,.13)');
  dens.addColorStop(1.00,'rgba(191,196,203,0)');
  g.fillStyle = dens; g.fillRect(0,0,w,h);
  /* faint bloom where the mirror's own light pushes through */
  var core = g.createRadialGradient(w*0.5,h*0.47,0,w*0.5,h*0.47,w*0.5);
  core.addColorStop(0,'rgba(255,244,228,.10)');
  core.addColorStop(0.55,'rgba(255,238,220,.04)');
  core.addColorStop(1,'rgba(255,236,216,0)');
  g.fillStyle = core; g.fillRect(0,0,w,h);

  /* micro condensation beads + grain, clipped to existing fog */
  g.globalCompositeOperation = 'source-atop';
  for (i=0;i<420;i++){
    var px = Math.random()*w, py = Math.random()*h, pr = rand(0.35,1.5);
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.16)' : 'rgba(150,156,166,.13)';
    g.beginPath(); g.arc(px,py,pr,0,TAU); g.fill();
  }
  g.globalAlpha = 0.15;
  var pat = g.createPattern(NOISE,'repeat');
  if (pat){ g.fillStyle = pat; g.fillRect(0,0,w,h); }
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';

  return c;
}

function applyMask(){
  if (!fogTex) return;
  fctx.setTransform(1,0,0,1,0,0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0,0,fog.width,fog.height);
  fctx.drawImage(fogTex,0,0,fog.width,fog.height);
  fctx.globalCompositeOperation = 'destination-out';
  fctx.drawImage(mask,0,0,fog.width,fog.height);
  fctx.globalCompositeOperation = 'source-over';
  fctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ═══ layout ════════════════════════════════════════════════ */
var IRW = 168, IRH = Math.round(IRW/AR);
iri.width = IRW; iri.height = IRH;

var layoutQueued = false;
function queueLayout(){
  if (layoutQueued) return;
  layoutQueued = true;
  requestAnimationFrame(function(){ layoutQueued = false; layout(); });
}

function layout(){
  var r = glass.getBoundingClientRect();
  var w = Math.max(40, Math.round(r.width)), h = Math.max(40, Math.round(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cx = r.left + r.width/2; cy = r.top + r.height/2;

  var changed = (w !== gw || h !== gh || fog.width !== Math.round(w*dpr));
  gw = w; gh = h;

  if (changed){
    fog.width  = Math.round(w*dpr); fog.height = Math.round(h*dpr);
    drops.width = fog.width;        drops.height = fog.height;
    dctx.setTransform(dpr,0,0,dpr,0,0);
    fogTex = buildFogTexture(w,h,dpr);
    applyMask();
  }

  /* air canvas (dust + petals) — lighter dpr, it's all soft blobs */
  var adpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var aw = Math.round(innerWidth*adpr), ah = Math.round(innerHeight*adpr);
  if (air.width !== aw || air.height !== ah){
    air.width = aw; air.height = ah;
    actx.setTransform(adpr,0,0,adpr,0,0);
    seedMotes();
  }
  if (STILL) renderOnce();
}

/* ═══ iridescent liquid field ═══════════════════════════════ */
/* mother-of-pearl: soft additive colour blobs on slow lissajous
   paths, drawn tiny and upscaled by CSS — no high frequencies,
   so the upscale is invisible and it costs almost nothing.      */
var IRI_BLOBS = [
  { c:'28,205,190', ax:.30, ay:.20, ox:.34, oy:.28, r:.78, f1:.047, f2:.031, p1:0.0, p2:1.9, a:.40, br:.16, bf:.023 },
  { c:'120,232,255', ax:.26, ay:.24, ox:.68, oy:.22, r:.66, f1:.038, f2:.052, p1:2.1, p2:0.4, a:.33, br:.14, bf:.031 },
  { c:'128,104,240', ax:.32, ay:.26, ox:.30, oy:.62, r:.82, f1:.029, f2:.041, p1:4.0, p2:2.7, a:.38, br:.18, bf:.019 },
  { c:'232,96,176', ax:.28, ay:.22, ox:.70, oy:.66, r:.70, f1:.043, f2:.026, p1:1.2, p2:5.1, a:.35, br:.15, bf:.027 },
  { c:'255,148,112', ax:.24, ay:.28, ox:.50, oy:.82, r:.62, f1:.034, f2:.045, p1:5.4, p2:3.3, a:.30, br:.13, bf:.035 },
  { c:'255,208,138', ax:.22, ay:.20, ox:.46, oy:.40, r:.56, f1:.055, f2:.037, p1:3.1, p2:1.1, a:.32, br:.12, bf:.041 },
  { c:'255,244,226', ax:.18, ay:.16, ox:.42, oy:.34, r:.42, f1:.025, f2:.033, p1:0.7, p2:4.4, a:.26, br:.10, bf:.029 }
];
var IRI_SPRITES = IRI_BLOBS.map(function(b){ return blobSprite(b.c); });
var IRI_FADE = (function(){
  var c = makeCanvas(IRW,IRH), g = c.getContext('2d');
  g.save(); g.translate(IRW/2,IRH/2); g.scale(1,IRH/IRW); g.translate(-IRW/2,-IRW/2);
  var gr = g.createRadialGradient(IRW/2,IRW/2,IRW*0.30,IRW/2,IRW/2,IRW*0.54);
  gr.addColorStop(0,'rgba(0,0,0,0)');
  gr.addColorStop(0.72,'rgba(0,0,0,.55)');
  gr.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle = gr; g.fillRect(-IRW,-IRW,IRW*3,IRW*3);
  g.restore();
  return c;
})();

var iriT = STILL ? 41.7 : rand(0,60);
function drawIri(){
  ictx.setTransform(1,0,0,1,0,0);
  ictx.clearRect(0,0,IRW,IRH);
  ictx.globalCompositeOperation = 'lighter';
  /* While fog still covers the glass, the cleared patches have to out-shine it
     — the fog sits around 180 luminance, so an unboosted field (50-160) would
     read as a grease smear. The boost decays to exactly 1 at completion, so the
     final bloomed mirror is untouched. */
  var boost = 1 + (1 - curRV) * 0.85;
  for (var i=0;i<IRI_BLOBS.length;i++){
    var b = IRI_BLOBS[i];
    var x = (b.ox + b.ax*Math.sin(iriT*b.f1 + b.p1)) * IRW;
    var y = (b.oy + b.ay*Math.sin(iriT*b.f2 + b.p2)) * IRH;
    var rad = (b.r + b.br*Math.sin(iriT*b.bf + b.p1*0.7)) * IRW;
    ictx.globalAlpha = Math.min(1, b.a * boost * (0.78 + 0.22*Math.sin(iriT*b.bf*1.7 + b.p2)));
    ictx.drawImage(IRI_SPRITES[i], x-rad, y-rad, rad*2, rad*2);
  }
  ictx.globalAlpha = 1;
  ictx.globalCompositeOperation = 'destination-out';
  ictx.drawImage(IRI_FADE,0,0);
  ictx.globalCompositeOperation = 'source-over';
}

/* ═══ dust motes + petals of light ══════════════════════════ */
var motes = [], petals = [], petalBudget = 0, petalTimer = 0;
function seedMotes(){
  var n = innerWidth < 520 ? 22 : 44;
  if (RM) n = Math.round(n*0.45);
  motes.length = 0;
  for (var i=0;i<n;i++){
    motes.push({
      x: Math.random()*innerWidth, y: Math.random()*innerHeight,
      r: rand(0.7,2.4), vx: rand(-4,4), vy: rand(-9,-2),
      ph: rand(0,TAU), sp: rand(0.4,1.3), o: rand(.22,.7)
    });
  }
}
function spawnPetal(aged){
  if (petals.length > 34) return;
  var a = rand(0,TAU);
  var rx = gw*0.5, ry = gh*0.5;
  var p = {
    x: cx + Math.cos(a)*rx*rand(.5,.98),
    y: cy + Math.sin(a)*ry*rand(.5,.98),
    vx: Math.cos(a)*rand(4,16), vy: Math.sin(a)*rand(3,12) - rand(6,18),
    s: rand(gw*0.09, gw*0.26), rot: rand(0,TAU), rv: rand(-.22,.22),
    life: 1, decay: rand(.10,.20), o: rand(.35,.8)
  };
  if (aged){
    var t = Math.random()*2.6;
    p.x += p.vx*t; p.y += p.vy*t - 6*t*t; p.rot += p.rv*t; p.life -= p.decay*t;
    if (p.life <= .06) p.life = rand(.2,.8);
  }
  petals.push(p);
}
function drawAir(dt){
  actx.clearRect(0,0,innerWidth,innerHeight);
  actx.globalCompositeOperation = 'lighter';
  var i, m, d, fall, rv = curRV;
  var maxD = Math.max(260, Math.hypot(innerWidth,innerHeight)*0.42);
  for (i=0;i<motes.length;i++){
    m = motes[i];
    if (!RM){
      m.ph += dt*m.sp;
      m.x += (m.vx + Math.sin(m.ph)*7) * dt;
      m.y += m.vy * dt;
      if (m.y < -20){ m.y = innerHeight+20; m.x = Math.random()*innerWidth; }
      if (m.x < -20) m.x = innerWidth+20; else if (m.x > innerWidth+20) m.x = -20;
    }
    d = Math.hypot(m.x-cx, m.y-cy);
    fall = clamp(1 - d/maxD, 0, 1);
    var a = m.o * (0.18 + 0.82*fall*fall) * (0.45 + 0.55*rv) * (0.6 + 0.4*Math.sin(m.ph*1.7));
    if (a <= 0.004) continue;
    actx.globalAlpha = clamp(a,0,1);
    var s = m.r*7;
    actx.drawImage(MOTE, m.x-s, m.y-s, s*2, s*2);
  }
  for (i=petals.length-1;i>=0;i--){
    var p = petals[i];
    if (!STILL){
      p.vy += 4*dt;                 /* gentle lift-then-settle */
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.rv*dt;
      p.life -= p.decay*dt;
    }
    if (p.life <= 0){ petals.splice(i,1); continue; }
    actx.globalAlpha = clamp(p.life*p.o,0,1);
    actx.save();
    actx.translate(p.x,p.y); actx.rotate(p.rot);
    actx.drawImage(PETAL, -p.s, -p.s*0.5, p.s*2, p.s);
    actx.restore();
  }
  actx.globalAlpha = 1;
  actx.globalCompositeOperation = 'source-over';
}

/* ═══ condensation droplets ═════════════════════════════════ */
var droplets = [];
var MAXDROPS = RM ? 6 : 12;
function spawnDrop(x,y){
  if (droplets.length >= MAXDROPS) return;
  droplets.push({
    x: x + rand(-14,14), y: y + rand(-10,10),
    r: rand(1.4,3.6), vy: rand(2,14), wob: rand(0,TAU),
    stick: Math.random()<.45 ? rand(.15,.7) : 0,
    life: rand(2.6,5.2)
  });
}
function drawDrops(dt){
  if (!droplets.length){
    if (dropsDirty){ dctx.clearRect(0,0,gw,gh); dropsDirty = false; }
    return;
  }
  dctx.clearRect(0,0,gw,gh);
  dropsDirty = true;
  for (var i=droplets.length-1;i>=0;i--){
    var d = droplets[i];
    if (!STILL){
      d.life -= dt;
      if (d.stick > 0){ d.stick -= dt; }
      else {
        d.vy = Math.min(d.vy + 34*dt*(d.r/3), 130);
        d.wob += dt*3.1;
        var px = d.x, py = d.y;
        d.y += d.vy*dt;
        d.x += Math.sin(d.wob)*7*dt;
        if (d.y - py > 0.4 && fogAlive) trail(px, py, d.x, d.y, d.r);
        if (Math.random() < dt*0.5) d.stick = rand(.1,.5);
      }
    }
    if (d.life <= 0 || d.y > gh+8){ droplets.splice(i,1); continue; }
    var a = clamp(d.life/1.1, 0, 1);
    var s = d.r*2.6;
    dctx.globalAlpha = a*0.85;
    dctx.drawImage(BEAD_D, d.x-s*0.9, d.y-s*0.75, s*2, s*2);
    dctx.globalAlpha = a;
    dctx.drawImage(BEAD_L, d.x-d.r*1.35, d.y-d.r*1.5, d.r*2.7, d.r*3);
  }
  dctx.globalAlpha = 1;
}
var dropsDirty = false;

/* ═══ ripples ═══════════════════════════════════════════════ */
var lastRip = 0;
function ripple(x,y,scale){
  if (RM || STILL) return;
  var now = performance.now();
  if (now - lastRip < 95) return;
  lastRip = now;
  while (ripsEl.childElementCount > 12) ripsEl.removeChild(ripsEl.firstChild);
  var size = gw * (scale || rand(.55,.9));
  var el = doc.createElement('div');
  el.className = 'rip';
  el.style.width = size+'px'; el.style.height = size+'px';
  el.style.left = (x - size/2)+'px'; el.style.top = (y - size/2)+'px';
  el.addEventListener('animationend', function(){ if (el.parentNode) el.parentNode.removeChild(el); });
  ripsEl.appendChild(el);
}

/* ═══ erasing ═══════════════════════════════════════════════ */
var fogAlive = true;
var THRESHOLD = 0.65;
var state = 'idle';                            /* idle | wiping | burning | bloomed */
var curRV = 0, lastRVset = -1;

function setRV(v){
  curRV = clamp(v,0,1);
  var q = Math.round(curRV*100)/100;
  if (q === lastRVset) return;
  lastRVset = q;
  root.style.setProperty('--rv', String(q));
}

/* one soft dab, mirrored into the resolution-independent mask */
function stamp(x,y,r,alpha){
  var a = alpha === undefined ? 0.86 : alpha;
  fctx.globalCompositeOperation = 'destination-out';
  fctx.globalAlpha = a;
  fctx.drawImage(BRUSH, x-r, y-r, r*2, r*2);
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'source-over';

  var sx = MW/gw, sy = MH/gh;
  mctx.globalAlpha = a;
  mctx.drawImage(BRUSH, (x-r)*sx, (y-r)*sy, r*2*sx, r*2*sy);
  mctx.globalAlpha = 1;

  markGrid(x,y,r);
}

/* a droplet running down clears a thin channel of fog — interpolated, or a
   fast bead leaves a dotted chain instead of a streak */
function trail(x0,y0,x1,y1,r){
  var rr = Math.max(2.2, r*1.35);
  var d = Math.hypot(x1-x0, y1-y0);
  var n = Math.max(1, Math.ceil(d/(rr*0.45)));
  for (var i=1;i<=n;i++){
    var t = i/n;
    stamp(x0+(x1-x0)*t, y0+(y1-y0)*t, rr, 0.17);
  }
}

/* interpolated stroke so fast flicks never leave gaps */
function stroke(x0,y0,x1,y1,r){
  var dx = x1-x0, dy = y1-y0;
  var dist = Math.hypot(dx,dy);
  var step = Math.max(1.6, r*0.26);
  var n = Math.max(1, Math.ceil(dist/step));
  for (var i=1;i<=n;i++){
    var t = i/n;
    var jx = (Math.random()-0.5)*r*0.17, jy = (Math.random()-0.5)*r*0.17;
    stamp(x0+dx*t+jx, y0+dy*t+jy, r*rand(0.88,1.12));
  }
}

function baseRadius(){ return clamp(gw*0.118, 20, 58); }

/* first contact sharpens the type (it is blurred to illegibility under fog) */
function markWiped(){ root.classList.add('wiped'); }

function onProgress(){
  setRV(progress/THRESHOLD);
  if (progress > 0.035) showReset(true);
  if (state !== 'burning' && state !== 'bloomed' && progress >= THRESHOLD) startBurn(null);
}

/* ═══ pointer ═══════════════════════════════════════════════ */
var pointers = new Map();
var touched = false;

function localPoint(e){
  var r = glass.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function stopHint(){
  touched = true;
  hintEl.classList.remove('on');
  if (idleTimer){ clearTimeout(idleTimer); idleTimer = 0; }
  if (hintOffTimer){ clearTimeout(hintOffTimer); hintOffTimer = 0; }
}

function down(e){
  if (state === 'burning' || !fogAlive) return;
  stopHint();
  markWiped();
  try { glass.setPointerCapture(e.pointerId); } catch(err){}
  var p = localPoint(e);
  pointers.set(e.pointerId, { x:p.x, y:p.y, t:performance.now() });
  state = 'wiping';
  var r = baseRadius();
  stamp(p.x, p.y, r);
  ripple(p.x, p.y, 0.5);
  if (Math.random() < .6) spawnDrop(p.x, p.y);
  onProgress();
  e.preventDefault();
}
function move(e){
  var prev = pointers.get(e.pointerId);
  if (!prev) return;
  if (state === 'burning' || !fogAlive){ pointers.delete(e.pointerId); return; }
  e.preventDefault();

  var pts = (e.getCoalescedEvents ? e.getCoalescedEvents() : null);
  if (!pts || !pts.length) pts = [e];
  var r0 = glass.getBoundingClientRect();
  var now = performance.now();
  var dt = Math.max(8, now - prev.t);
  var lx = prev.x, ly = prev.y;

  for (var i=0;i<pts.length;i++){
    var x = pts[i].clientX - r0.left, y = pts[i].clientY - r0.top;
    var speed = Math.hypot(x-lx, y-ly) / dt * 1000;
    var r = baseRadius() * (1 + Math.min(speed/1400, 0.32));
    stroke(lx, ly, x, y, r);
    lx = x; ly = y;
  }
  prev.x = lx; prev.y = ly; prev.t = now;

  ripple(lx, ly);
  if (Math.random() < .12) spawnDrop(lx, ly);
  onProgress();
}
function up(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  try { glass.releasePointerCapture(e.pointerId); } catch(err){}
  if (!pointers.size && state === 'wiping') state = 'idle';
}

glass.addEventListener('pointerdown', down);
glass.addEventListener('pointermove', move, { passive:false });
glass.addEventListener('pointerup', up);
glass.addEventListener('pointercancel', up);
glass.addEventListener('lostpointercapture', up);
glass.addEventListener('contextmenu', function(e){ e.preventDefault(); });
doc.addEventListener('touchmove', function(e){ if (pointers.size) e.preventDefault(); }, { passive:false });
doc.addEventListener('gesturestart', function(e){ e.preventDefault(); });

/* ═══ burn-off ══════════════════════════════════════════════ */
var burn = { on:false, t:0, dur:1000, frozen:false, cx:0, cy:0, R:1, seed:[] };

function eraseRadial(x,y,R){
  if (R <= 0) return;
  var sx = MW/gw, sy = MH/gh;
  for (var k=0;k<burn.seed.length;k++){
    var s = burn.seed[k];
    var ox = x + s.dx*R*0.16, oy = y + s.dy*R*0.16, rr = R*s.sc;
    if (rr <= 0) continue;
    var g1 = fctx.createRadialGradient(ox,oy,rr*0.62,ox,oy,rr);
    g1.addColorStop(0,'rgba(255,255,255,1)');
    g1.addColorStop(0.72,'rgba(255,255,255,.55)');
    g1.addColorStop(1,'rgba(255,255,255,0)');
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = g1;
    fctx.fillRect(ox-rr, oy-rr, rr*2, rr*2);
    fctx.globalCompositeOperation = 'source-over';

    var mx = ox*sx, my = oy*sy, mr = rr*sx;
    var g2 = mctx.createRadialGradient(mx,my,mr*0.62,mx,my,mr);
    g2.addColorStop(0,'rgba(255,255,255,1)');
    g2.addColorStop(0.72,'rgba(255,255,255,.55)');
    g2.addColorStop(1,'rgba(255,255,255,0)');
    mctx.fillStyle = g2;
    mctx.fillRect(mx-mr, my-mr, mr*2, mr*2);
  }
}

function startBurn(freezeAt){
  if (burn.on || state === 'bloomed') return;
  state = 'burning';
  pointers.clear();
  stopHint();
  markWiped();
  var c = clearedCentroid();
  burn.cx = c.x; burn.cy = c.y;
  burn.on = true;
  burn.t = (freezeAt == null) ? 0 : freezeAt;
  burn.frozen = STILL && freezeAt != null;
  burn.seed = [
    { dx:0, dy:0, sc:1 },
    { dx:-0.8, dy:-0.5, sc:0.86 },
    { dx:0.7, dy:0.6, sc:0.9 }
  ];
  var corners = [[0,0],[gw,0],[0,gh],[gw,gh]], m = 0;
  for (var i=0;i<4;i++) m = Math.max(m, Math.hypot(corners[i][0]-burn.cx, corners[i][1]-burn.cy));
  burn.R = m*1.06;
  clearGridAll();
  setRV(1);
  showReset(true);
  if (RM) burn.dur = 700;
  stepBurn(0);
  start();
}

function stepBurn(dt){
  if (!burn.on) return;
  if (!burn.frozen) burn.t += dt/(burn.dur/1000);
  var t = clamp(burn.t,0,1);
  var e = t*t*(3-2*t);
  eraseRadial(burn.cx, burn.cy, e*burn.R);
  burnEl.style.transform = 'translate3d(' + ((-1.05 + e*2.15)*100).toFixed(2) + '%,0,0)';
  burnEl.style.opacity = (Math.sin(Math.PI*clamp(t*1.02,0,1)) * 0.98).toFixed(3);
  if (t >= 1 && !burn.frozen){ burn.on = false; finishBurn(); }
}

function finishBurn(){
  fogAlive = false;
  fctx.setTransform(1,0,0,1,0,0);
  fctx.clearRect(0,0,fog.width,fog.height);
  fctx.setTransform(dpr,0,0,dpr,0,0);
  mctx.fillStyle = '#fff'; mctx.fillRect(0,0,MW,MH);
  burnEl.style.opacity = '0';
  bloom();
}

/* ═══ bloom ═════════════════════════════════════════════════ */
function bloom(instant){
  state = 'bloomed';
  setRV(1);
  if (instant){
    p2El.style.transition = 'none'; p3El.style.transition = 'none'; sigEl.style.transition = 'none';
  }
  stageEl.classList.add('bloomed');
  root.classList.add('bloomed');
  if (instant){
    void revealEl.offsetWidth;
    requestAnimationFrame(function(){
      p2El.style.transition = ''; p3El.style.transition = ''; sigEl.style.transition = '';
    });
  }
  showReset(true);
  if (instant || STILL){
    /* screenshot paths get a distributed, pre-aged spray of petals */
    petalBudget = 0;
    for (var i=0, n=(RM ? 8 : 20); i<n; i++) spawnPetal(true);
  } else {
    petalBudget = RM ? 10 : 30;
    petalTimer = 0;
  }
  doc.title = 'you are soooo beautiful';
}

/* ═══ fog it up again ═══════════════════════════════════════ */
var refog = { on:false, t:0, dur:1250 };
function startRefog(){
  if (refog.on) return;
  burn.on = false;
  burnEl.style.opacity = '0';
  state = 'idle';
  fogAlive = true;
  droplets.length = 0;
  petals.length = 0;
  petalBudget = 0;
  while (ripsEl.firstChild) ripsEl.removeChild(ripsEl.firstChild);
  resetGrid();
  mctx.clearRect(0,0,MW,MH);
  stageEl.classList.remove('bloomed');
  root.classList.remove('bloomed');
  root.classList.remove('wiped');
  doc.title = 'someone left you a message';
  setRV(0);
  showReset(false);
  refog.on = true; refog.t = 0;
  stepRefog(0);
  start();
  touched = false;
  scheduleHint(4200);
}
function stepRefog(dt){
  if (!refog.on) return;
  refog.t += dt/(refog.dur/1000);
  var t = clamp(refog.t,0,1);
  var e = 1-Math.pow(1-t,2.2);
  var R = e * Math.hypot(gw,gh) * 0.78;

  fctx.setTransform(1,0,0,1,0,0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0,0,fog.width,fog.height);
  if (fogTex) fctx.drawImage(fogTex,0,0,fog.width,fog.height);
  fctx.setTransform(dpr,0,0,dpr,0,0);

  if (t < 1){
    fctx.globalCompositeOperation = 'destination-in';
    var bx = gw*0.5, by = gh*0.62;
    var g = fctx.createRadialGradient(bx,by,R*0.42,bx,by,R);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.6,'rgba(255,255,255,.9)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    fctx.fillStyle = g;
    fctx.fillRect(0,0,gw,gh);
    fctx.globalCompositeOperation = 'source-over';
  } else {
    refog.on = false;
  }
}

function showReset(on){ resetEl.classList.toggle('show', !!on); }
resetEl.addEventListener('click', function(){
  if (state === 'burning') return;
  startRefog();
});

/* ═══ idle hint ═════════════════════════════════════════════ */
var idleTimer = 0, hintOffTimer = 0;
function scheduleHint(delay){
  if (STILL) return;
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){
    idleTimer = 0;
    if (touched || !fogAlive || state === 'burning' || state === 'bloomed') return;
    hintEl.classList.add('on');
    /* show it for three passes, then rest — never nag */
    hintOffTimer = setTimeout(function(){
      hintOffTimer = 0;
      hintEl.classList.remove('on');
      scheduleHint(7000);
    }, 13800);
  }, delay);
}

/* ═══ render loop ═══════════════════════════════════════════ */
var running = false, rafId = 0, lastT = 0, iriAcc = 0, trickle = 2.2;

function tickAll(dt){
  if (!STILL){
    iriAcc += dt;
    if (iriAcc >= 0.0333){
      iriT += iriAcc * (RM ? 0.35 : 1);
      drawIri();
      iriAcc = 0;
    }
  }
  if (burn.on)  stepBurn(dt);
  if (refog.on) stepRefog(dt);

  if (petalBudget > 0){
    petalTimer -= dt;
    if (petalTimer <= 0){ spawnPetal(false); petalBudget--; petalTimer = 0.085; }
  } else if (state === 'bloomed' && !RM && !STILL){
    trickle -= dt;
    if (trickle <= 0){ spawnPetal(false); trickle = rand(1.1,2.4); }
  }

  drawDrops(dt);
  drawAir(dt);
}

/* in ?still=1 the loop only runs to carry a one-shot transition
   (burn-off / re-fog) to completion — ambient motion stays frozen */
function needsLoop(){
  return !STILL || (burn.on && !burn.frozen) || refog.on;
}
function frame(ts){
  if (!running) return;
  var dt = lastT ? (ts - lastT)/1000 : 0.016;
  lastT = ts;
  /* Clamp long frames rather than replacing them: substituting a fixed 16ms
     made one-shot animations advance per-FRAME instead of per-second, so the
     burn-off stalled on a device (or tab) that was only managing a few fps. */
  if (!(dt > 0)) dt = 0.016; else if (dt > 0.05) dt = 0.05;
  tickAll(dt);
  if (!needsLoop()){ running = false; rafId = 0; renderOnce(); return; }
  rafId = requestAnimationFrame(frame);
}
function start(){
  if (running || !needsLoop()) return;
  running = true; lastT = 0;
  rafId = requestAnimationFrame(frame);
}
function stopLoop(){
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}
function renderOnce(){
  drawIri();
  drawDrops(0);
  drawAir(0);
}
doc.addEventListener('visibilitychange', function(){
  if (doc.hidden) stopLoop(); else start();
});

/* ═══ stage fast-forward (?s=N) ═════════════════════════════ */
function qbez(p0,p1,p2,t){
  var mt = 1-t;
  return [ mt*mt*p0[0] + 2*mt*t*p1[0] + t*t*p2[0],
           mt*mt*p0[1] + 2*mt*t*p1[1] + t*t*p2[1] ];
}
function syntheticWipe(target){
  var curves = [
    [[.26,.335],[.52,.300],[.76,.345]],
    [[.78,.410],[.50,.446],[.20,.408]],
    [[.17,.487],[.50,.524],[.83,.492]],
    [[.82,.567],[.50,.600],[.19,.570]],
    [[.23,.645],[.52,.678],[.78,.648]],
    [[.74,.722],[.50,.752],[.28,.724]],
    [[.30,.262],[.54,.238],[.72,.268]]
  ];
  var r0 = baseRadius();
  for (var c=0;c<curves.length;c++){
    var cu = curves[c], prev = null;
    for (var i=0;i<=44;i++){
      var q = qbez(cu[0],cu[1],cu[2], i/44);
      var x = q[0]*gw, y = q[1]*gh;
      var r = r0 * (0.9 + 0.22*Math.sin(i*0.31 + c*1.7));
      if (prev) stroke(prev[0],prev[1],x,y,r); else stamp(x,y,r);
      prev = [x,y];
      if (progress >= target) return;
    }
  }
}
function ageDrops(seconds){
  var steps = 34, dt = seconds/steps;
  for (var s=0;s<steps;s++){
    for (var i=droplets.length-1;i>=0;i--){
      var d = droplets[i];
      d.vy = Math.min(d.vy + 34*dt*(d.r/3), 130);
      var px = d.x, py = d.y;
      d.y += d.vy*dt; d.wob += dt*3.1; d.x += Math.sin(d.wob)*7*dt;
      if (d.y - py > 0.4 && fogAlive) trail(px,py,d.x,d.y,d.r);
      if (d.y > gh+8) droplets.splice(i,1);
    }
  }
}
function clearAllFog(){
  mctx.setTransform(1,0,0,1,0,0);
  mctx.fillStyle = '#fff'; mctx.fillRect(0,0,MW,MH);
  fctx.setTransform(1,0,0,1,0,0);
  fctx.clearRect(0,0,fog.width,fog.height);
  fctx.setTransform(dpr,0,0,dpr,0,0);
  clearGridAll();
  fogAlive = false;
}

function applyStage(){
  if (STAGE === null || STAGE === 0) return;
  markWiped();
  touched = true;
  hintEl.classList.remove('on');
  if (idleTimer){ clearTimeout(idleTimer); idleTimer = 0; }

  if (STAGE === 1){
    syntheticWipe(0.35);
    spawnDrop(gw*0.34, gh*0.36); spawnDrop(gw*0.62, gh*0.33);
    spawnDrop(gw*0.47, gh*0.52); spawnDrop(gw*0.71, gh*0.60);
    spawnDrop(gw*0.29, gh*0.62); spawnDrop(gw*0.55, gh*0.74);
    ageDrops(1.9);
    setRV(progress/THRESHOLD);
    showReset(true);
    state = 'idle';
  } else if (STAGE === 2){
    syntheticWipe(0.44);
    spawnDrop(gw*0.40, gh*0.40); spawnDrop(gw*0.63, gh*0.55);
    ageDrops(1.2);
    startBurn(STILL ? 0.55 : 0.38);
  } else if (STAGE === 3){
    clearAllFog();
    bloom(true);
    for (var j=0;j<5;j++) spawnDrop(rand(gw*0.2,gw*0.8), rand(gh*0.2,gh*0.7));
    ageDrops(1.4);
  }
}

/* ═══ boot ══════════════════════════════════════════════════ */
layout();
seedMotes();

if (typeof ResizeObserver === 'function'){
  new ResizeObserver(queueLayout).observe(glass);
}
window.addEventListener('resize', queueLayout);
window.addEventListener('orientationchange', function(){ setTimeout(queueLayout, 220); });

applyStage();

if (STILL){
  renderOnce();
} else {
  start();
  scheduleHint(3000);
}

/* keep the mirror centre accurate for the dust-mote lighting */
window.addEventListener('scroll', queueLayout, { passive:true });

})();

</script>
</body>
</html>
