<!--
  ─────────────────────────────────────────────────────────────────────────────
  THE VERY IMPORTANT DAY — a pop-up story for Katie.   (three.js 0.169, one file)

  A cloth-bound pop-up book lies on a table. Open it and real 3D paper stands up:
  a sleepy town at dawn, birds with a banner, bunny bakers, rehearsing stars, and
  a surprise party. Every layer is a hinged plane with procedurally drawn
  cut-paper art; soft contact-hardening shadows; synthesized paper sounds.

  THE BOOK MODEL (portrait-native, top-bound, stands open at 90° like a stage)
    · leaves 0..6 pivot on hinges laid along a 45° diagonal (the binding).
      leaf angle a: 0 = lying flat (front face up), π/2 = standing (back face to camera).
      leaf 0 = front cover, leaf 6 = back board. spread k = backdrop (back of leaf k−1)
      + floor (front of leaf k).
    · pop-up layers of spread k are children of leaf k, hinged at depth d, rotated by
      (a[k−1] − a[k]) relative to it, so they stay PARALLEL TO THE BACKDROP — a real
      parallel-fold. d + height ≤ page depth, so tall things live at the back.

  DEBUG / SCREENSHOT HOOKS  (query params, combinable — e.g. ?s=4&still=1)
    ?s=0     the closed book on the table (cloth cover, gold foil title, ribbon).
    ?s=1     spread 1 open, tab pulled: the sun up and awake, windows lit, bird popped.
    ?s=1.5   leaf 1 frozen mid-turn at 45°: spread-1 pop-ups upright, spread-2 rising.
    ?s=2     spread 2 — the birds and their banner.
    ?s=3     spread 3 — bunny bakers (one already has frosting on its nose).
    ?s=4     spread 4 — night; the stars rehearsing on paper springs.
    ?s=5     finale — candles lit, the "happy birthday" bubble up, confetti on the page.
    ?s=6     the end page, the note from amit, "read it again ↺".
             any fraction k.f freezes leaf k at f·90° (?s=0.5 = cover half open).
             every state is applied instantly (animations snapped to their settled
             pose), so a screenshot ~2s after load is already right. tap to resume.
    ?still=1 freezes ambient motion (bobbing, banner, flames, camera drift).
    ?mute=1  no sound.     ?far=0  the not-long-distance copy.     ?name=someone (capitalised: Someone)
    ?cam=az,el   debug camera angles in degrees (e.g. ?s=1.5&cam=80,12 = side view)

  window.__bday = { state(), go(s), next(), prev(), pull(p), tap(id), finale(), ... }
  ─────────────────────────────────────────────────────────────────────────────
-->

<script type="module">
// ══ customise me ══════════════════════════════════════════════════════════
const CONFIG = {
  herName: "Katie",       // always written with a capital K
  myName: "amit",
  farAway: true,   // long-distance lines on/off (each has a local alternative)

  // the cover (gold foil) — {her} becomes her name
  title: "the very important day",
  subtitle: "a pop-up story for {her}",

  // one line per spread. printed on the page AND shown crisply below the book.
  pages: [
    "once upon a time, the sun got up extra early. it had heard a rumour.",
    "the birds were put in charge of the banner. they took it very seriously.",
    "the bunnies were put in charge of the cake. this was a mistake. (they kept eating the frosting.)",
    "and all day long, the stars rehearsed. they would only get one chance to sparkle for her.",
    "and then, at last, it was time.",
  ],
  banner: "{her}",                        // what the birds are carrying
  bubble: "happy birthday, {her}!",       // the big paper speech bubble
  shh: "shh!",                            // whispered in the dark, just before

  // the last page
  endTitle: "the end.",
  endSub: "(of this chapter.)",
  endNote: "everyone in this book got up early for you. i would too. every single day.",
  signFar: "made 8,000 km away, with love — {me}",
  signNear: "with love — {me}",
  again: "read it again",

  // little nudges if she goes quiet for a few seconds
  hints: {
    cover: "tap the book to open it",
    tab: "pull the little tab",
    turn: "drag the page up",
    birds: "tap a bird",
    bunnies: "tap a bunny",
    stars: "tap the stars",
    cake: "tap the cake",
  },
  next: "next", open: "open", again2: "again",
};
// ═════════════════════════════════════════════════════════════════════════

/* ══ environment & flags ═══════════════════════════════════════════════ */
const QS = new URLSearchParams(location.search);
// her name keeps its capital (Katie); a ?name= override is capitalised the same way
const capName = (n) => { n = String(n || '').trim().slice(0, 18); return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : ''; };
const HER = capName(QS.get('name') || CONFIG.herName) || 'Katie';
const ME = (CONFIG.myName || 'amit').trim().toLowerCase();
const FAR = QS.has('far') ? QS.get('far') !== '0' : !!CONFIG.farAway;
const STILL = QS.get('still') === '1';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const S_RAW = QS.has('s') ? Math.max(0, Math.min(6, parseFloat(QS.get('s')) || 0)) : null;
const CAMQ = QS.get('cam');
const PHONE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
if (STILL) document.body.classList.add('still');

const fill = (s) => String(s).replace(/\{her\}/g, HER).replace(/\{me\}/g, ME);
const COPY = {
  title: fill(CONFIG.title), subtitle: fill(CONFIG.subtitle),
  pages: CONFIG.pages.map(fill), banner: fill(CONFIG.banner), bubble: fill(CONFIG.bubble), shh: fill(CONFIG.shh),
  endTitle: fill(CONFIG.endTitle), endSub: fill(CONFIG.endSub), endNote: fill(CONFIG.endNote),
  sign: fill(FAR ? CONFIG.signFar : CONFIG.signNear), again: fill(CONFIG.again),
};

/* ══ tiny helpers ══════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const HALF = Math.PI / 2, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smooth = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const backOut = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const elastic = (t) => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const rr = (a, b) => a + rnd() * (b - a);
// smooth 1-d value noise (for hand-cut wobble)
function noise1(x, seed = 0) {
  const h = (n) => { const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return s - Math.floor(s); };
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(h(i), h(i + 1), u) * 2 - 1;
}
// damped spring helper: { x, v } toward target
function spring(s, target, k, c, dt) { s.v += (k * (target - s.x) - c * s.v) * dt; s.x += s.v * dt; return s.x; }

/* ══ AUDIO — all synthesized ═══════════════════════════════════════════

   a quiet warm room tone underneath everything.                                    */
const AU = (() => {
  let ctx = null, master = null, bus = null, send = null, noiseBuf = null, room = null;
  let muted = QS.get('mute') === '1';
  const A = { get ctx() { return ctx; }, get muted() { return muted; } };

  function impulse(sec, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * sec), buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0; const r = mulberry(77 + ch * 13);
      for (let i = 0; i < len; i++) {
        const t = i / len, k = 0.62 - 0.5 * t;              // air absorption: darker as it decays
        lp += k * ((r() * 2 - 1) - lp);

        d[i] = (lp + early * (1 - t)) * Math.pow(1 - t, decay) * Math.min(1, i / (rate * 0.006));
      }
    }
    return buf;
  }
  A.init = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { return; }
    const comp = ctx.createDynamicsCompressor();

  $('sr').textContent = k === 0 ? COPY.title : k <= 5 ? COPY.pages[k - 1] : COPY.endTitle + ' ' + COPY.endNote + ' ' + COPY.sign;
}
function setNav(k) {
  $('prev').classList.toggle('ghost', k === 0);
  const nb = $('next'); nb.querySelector('.lb').textContent = k === 0 ? CONFIG.open : k === 6 ? COPY.again : CONFIG.next;
  nb.querySelector('.ar').textContent = k === 6 ? '↺' : '›'; nb.classList.remove('glow');
  nb.setAttribute('aria-label', k === 6 ? COPY.again : 'next page');
  [...$('dots').children].forEach((d, i) => { d.classList.toggle('on', i === k - 1); d.classList.toggle('done', i < k - 1); });

}
$('next').addEventListener('click', () => { AU.init(); poke(); buzz(8); next(); });
$('prev').addEventListener('click', () => { AU.init(); poke(); buzz(8); prev(); });
$('mute').addEventListener('click', () => { AU.init(); const m = !AU.muted; AU.setMuted(m); $('mute').classList.toggle('off', m); buzz(6); });
if (AU.muted) $('mute').classList.add('off');
const hintEl = $('hint');
let hintOn = false, hintKey = null, cueT = 0;
const HINT_ARROW = { cover: '✧', tab: '↓', turn: '↑' };

  hintEl.querySelector('.tx').textContent = CONFIG.hints[key]; hintEl.querySelector('.fi').textContent = HINT_ARROW[key] || '✧';
  hintEl.classList.add('on'); hintOn = true; hintKey = key; cueT = T - 99;
  if (key === 'turn') $('next').classList.add('glow');
}
function hideHint() { if (hintOn) { hintEl.classList.remove('on'); hintOn = false; } }

/* ══ LOOP ═════════════════════════════════════════════════════════════ */
let T = 0, lastNow = performance.now(), shimmered = false, ambT = 3;
const lastGap = [];
function updateLayers() {
  for (const L of LAYERS) {
    const gap = leaves[L.k - 1].a - leaves[L.k].a, vis = gap > 0.0015;
    if (L.pivot.visible !== vis) L.pivot.visible = vis;
    if (!vis) continue;
    let rel = clamp(gap, 0, HALF) * L.pop;
    const j = JIG[L.k]; if (j && !RM) { const e = T - j.t0; if (e < 2.2) rel += j.amp * 0.075 * Math.exp(-e * 4.2) * Math.sin(e * 20 - L.d * 6) * (gap / HALF); }

}
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { lastNow = now; return; }
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now; T += dt;
  const AT = STILL ? 4.2 : T;
  for (const L of leaves) {
    if (drag.mode === 'turn' && drag.leaf === L) L.a += (drag.tgt - L.a) * (1 - Math.exp(-dt * 26));
    else stepLeaf(L, dt);
    if (L.peek !== undefined) { const e = T - L.peek; if (e > 1.1 || L.auto || drag.leaf === L) L.peek = undefined; else if (L.a < 0.2) L.a = 0.11 * Math.sin(Math.PI * clamp(e / 1.1, 0, 1)) * (1 - e / 2.2); }
  }
  for (let i = NLEAF - 2; i >= 0; i--) if (leaves[i].a < leaves[i + 1].a) { leaves[i].a = leaves[i + 1].a; }
  for (const L of leaves) L.pivot.rotation.x = -L.a;
  placeHinges();
  updateLayers();
  for (let k = 1; k <= 6; k++) {
    const g = leaves[k - 1].a - leaves[k].a, p = lastGap[k] ?? g;
    if (p < 0.5 && g >= 0.5) AU.fwff(1); if (p < 1.3 && g >= 1.3) AU.fwff(0.5, 0.05);
    lastGap[k] = g;

  }
  SPK.step(dt); PUF.step(dt);
  if (!shimmered && leaves[0].a > 1.0) { shimmered = true; AU.shimmer(); }
  if (AU.ctx && !AU.muted && T > ambT && !busy()) { const m = SPREAD_MOOD[Math.round(moodPos)];
    if (m === 'night') { AU.cricket(); ambT = T + 1.1 + Math.random() * 2.2; }
    else if (m === 'dawn' || m === 'bright') { AU.farBird(); ambT = T + 3 + Math.random() * 5; }
    else ambT = T + 2; }
  applyMood(); applyCamera(AT, dt);
  // idle nudges
  const idle = T - lastInput;
  if (!hintOn && idle > 4.2 && !busy() && drag.id === null && booted) { const h = currentHint(); if (h) showHint(h); }
  if (hintOn && T - cueT > 3.6 && !busy() && drag.id === null) { cueT = T; cue(hintKey); }
  renderer.render(scene, camera);
}

/* ══ STATES (?s=) & BOOT ══════════════════════════════════════════════ */
let booted = false;
function buildSpread(k) {
  const S = SPREADS[k]; if (!S || S.built) return;
  const defs = (S.layers || []).slice().sort((a, b) => b.d - a.d);
  S.L = {}; defs.forEach((def, rank) => { S.L[def.id] = addLayer(k, def, rank); });
  if (S.init) S.init(S);
  S.built = true;
}
function applyState(s) {
  const k = Math.min(6, Math.floor(s + 1e-6)), f = s - k;
  leaves.forEach((L) => { L.auto = false; L.v = 0; L.a = L.i < k ? HALF : (L.i === k && k < 6 ? f * HALF : 0); });
  cur = k;
  for (let j = Math.max(1, k - 1); j <= Math.min(6, k + 1); j++) paintSpread(j);
  for (let j = 6; j > k; j--) { const S = SPREADS[j]; if (S && S.reset) S.reset(S); }
  for (let j = 1; j <= Math.min(6, k); j++) { const S = SPREADS[j]; if (S && S.settle) S.settle(S, j === k); }
  for (let j = 1; j <= 6; j++) lastGap[j] = leaves[j - 1].a - leaves[j].a;
  setCaption(k, true); setNav(k);
  const m = MOOD[SPREAD_MOOD[k]]; document.documentElement.style.setProperty('--capc', m.cap); document.documentElement.style.setProperty('--capglow', m.glow);
  const S = SPREADS[k]; if (S && S.enter) S.enter(S, -1, true);
}
function showFallback() {
  document.body.classList.add('fallback'); $('load').classList.add('gone');
  $('fbTitle').textContent = COPY.title; $('fbSub').textContent = COPY.subtitle;
  const b = $('fbBody'); b.innerHTML = '';
  const add = (t, c) => { const p = document.createElement('p'); p.textContent = t; if (c) p.className = c; b.appendChild(p); };
  COPY.pages.forEach((p) => add(p)); add(COPY.bubble, 'hb'); add(COPY.endTitle + ' ' + COPY.endSub); add(COPY.endNote); add(COPY.sign, 'sig');
  for (const id of ['cap', 'mute', 'hint']) { const el = $(id); if (el) el.style.display = 'none'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) AU.suspend(); else AU.resume(); });
let rzT = 0, lastW = 0, lastH = 0;
function onResize() {
  clearTimeout(rzT);
  rzT = setTimeout(() => { const w = innerWidth, h = innerHeight; if (w === lastW && Math.abs(h - lastH) < 2) return; lastW = w; lastH = h; layout(); }, 120);
}
addEventListener('resize', onResize); addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
{ const pr = document.createElement('div'); pr.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
  document.body.appendChild(pr); document.documentElement.style.setProperty('--satpx', pr.offsetHeight + 'px'); }

try {
  await Promise.race([Promise.all(['italic 400 40px Fraunces', 'italic 600 40px Fraunces', '400 40px Fraunces', 'italic 400 40px "EB Garamond"', '400 40px "EB Garamond"'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 3500))]);
} catch (e) {}
for (let k = 1; k <= 6; k++) buildSpread(k);
if (COVER.paint) COVER.paint(leaves[0], leaves[NLEAF - 1]);
layout(); lastW = innerWidth; lastH = innerHeight;
if (S_RAW !== null) applyState(S_RAW); else { cur = 0; setCaption(0, true); setNav(0); paintSpread(1); introT = 0.15; }
requestAnimationFrame((t) => { lastNow = t; frame(t); });
setTimeout(() => { $('load').classList.add('gone'); booted = true; lastInput = T; }, 120);

window.__bday = {
  state: () => ({ cur, a: leaves.map((L) => +L.a.toFixed(3)), T: +T.toFixed(2), busy: busy(), hint: hintOn ? hintKey : null }),
  go: (s) => applyState(s), next: () => next(), prev: () => prev(), again: () => again(),
  sp: (k) => SPREADS[k], leaves, LAYERS, camera, renderer, key, hemi, rim, scene, MOOD, MC, THREE, AU, SPK,
  envI: (v) => scene.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => { if ('envMapIntensity' in m) m.envMapIntensity = v; }); }),
  // screen position (css px) of a layer / sub-piece centre, for scripted taps: xy(5,'cake') or xy(2,'banner','bM')
  xy: (k, id, sub) => { const L = SPREADS[k].L[id], o = sub ? L.subs[sub].mesh : L.mesh; o.geometry.computeBoundingBox(); const c = new THREE.Vector3(); o.geometry.boundingBox.getCenter(c);
    o.updateWorldMatrix(true, false); o.localToWorld(c); return screenOf(c).map(Math.round); },
  tabXY: () => { const S = SPREADS[1]; const c = new THREE.Vector3(0, -0.05, 0.01); S.tabG.updateWorldMatrix(true, false); S.tabG.localToWorld(c); return screenOf(c).map(Math.round); },
};
