<!DOCTYPE html>
<!--
  A BIRTHDAY READING — a cute-mystical tarot reading on a velvet table.
  ────────────────────────────────────────────────────────────────────────────
  She taps the deck, it riffles and fans out, she picks three (the year behind
  you · today · the year ahead), turns them over one by one — holographic foil
  that moves when she tilts her phone — and reads them. Then: "curious what the
  other cards said?" The whole deck flips in a wave: every single card is a good
  one. And from the middle rises a card that isn't in any deck: XXII · KATIE.
  (A tarot deck's major arcana stop at XXI. That's the joke. That's the point.)

  The reading is rigged: card content is dealt by SLOT (past/today/future) from
  CONFIG.spread, not by which card she taps. She can't tell.

  DEBUG / SCREENSHOT HOOKS  (query params, combinable — e.g. ?s=3&still=1)
    ?s=0   intro: title in the sky, the deck breathing centre-stage.
    ?s=1   the deck fanned across the table, three empty slots waiting.
    ?s=2   three cards placed face-down in their slots, the rest still fanned.
    ?s=3   the first card turned over and focused: big holo card + reading.
    ?s=4   all three turned over, the combined line, "curious what the other
           cards said?" waiting.
    ?s=5   the wave has happened: the rest of the deck face-up in a tableau,
           "this deck only has good cards in it. i checked. twice."
    ?s=6   the finale: XXII · KATIE, the meaning, the note, "— amit", again ↺.
    Every ?s= state is applied instantly (motion snapped to its settled pose),
    so a screenshot taken the moment the page loads is already right.

    ?still=1   freezes ambient motion (holo sway, star twinkle, clouds, the
               breathing deck, glints) at a good-looking frame. Layout is
               identical with and without it.
    ?mute=1    no sound.
    ?far=0     CONFIG.farAway = false (the non-distance copy).
    ?name=x    overrides CONFIG.herName (first letter capitalised: ?name=katie → Katie).
    ?tilt=x,y  QA only: pins the holo tilt vector (each -1…1) for stills.
    ?gallery=1 QA only: every card face + back + the XXII card laid out large.

  window.__bday = { state, go(n), tilt(x,y), layout } for headless steps.

  Everything is inline: SVG illustrations, canvas stars + sparkles, procedural
  textures, Web Audio synthesis. Only Google Fonts are fetched.
-->

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   tokens
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --gold:#d9b46a; --gold-deep:#b0843a; --gold-pale:#f3dfa6;
  --rose:#f4a7b9; --lilac:#c3b1e1; --butter:#f6dc9a; --mint:#bfe3d0; --sky:#b8d4f2;
  --cream:#fbf0dc;
  --title: 'Cinzel', 'Trajan Pro', Optima, 'Palatino Linotype', Palatino, Georgia, serif;
  --deco:  'Cinzel Decorative', 'Cinzel', 'Trajan Pro', Optima, Palatino, Georgia, serif;
  --read:  'Cormorant Garamond', Cormorant, Garamond, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --sans:  'Jost', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease-out: cubic-bezier(.2,.8,.25,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; background:#2b2650; overflow:hidden; overscroll-behavior:none; }
body{
  position:fixed; inset:0;
  font-family:var(--sans); color:#f6ead2;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:none;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button:focus-visible{ outline:2px solid rgba(243,223,166,.9); outline-offset:3px; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }

#app{ position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:default; }
#sa{ position:fixed; left:0; top:0; width:0; height:0; visibility:hidden; pointer-events:none;
     padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* ═══════════════════════════════════════════════════════════════════════════
   the scene: sky, stars, clouds, moon, velvet table, crystal ball, fringe.
   every layer is placed per frame by the JS camera (horizon tilts per act).
   ═══════════════════════════════════════════════════════════════════════════ */
#scene{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.cam{ position:absolute; left:0; top:0; will-change:transform; }
#sky{
  width:100%;
  background:linear-gradient(180deg,
    #15122c 0%, #1d1940 18%, #2b2650 38%, #3a3068 56%, #4a3b7a 70%,
    #5a4385 82%, #6b4c8a 92%, #7c5893 100%);
}
#skyGlow{
  width:100%; height:60vh;
  background:
    radial-gradient(60% 100% at 50% 100%, rgba(255,190,214,.30), rgba(255,190,214,0) 70%),
    radial-gradient(90% 80% at 50% 100%, rgba(196,160,236,.30), rgba(196,160,236,0) 70%);
}
#starsWrap{ position:absolute; left:0; top:0; width:100%;
  -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 88%, rgba(0,0,0,0) 99%); mask-image:linear-gradient(180deg, #000 0%, #000 88%, rgba(0,0,0,0) 99%); }
#starsWrap canvas{ position:absolute; left:0; top:0; width:100%; height:100%; animation:tw ease-in-out infinite alternate; }
#starsWrap canvas:nth-child(1){ animation-duration:2.9s; }
#starsWrap canvas:nth-child(2){ animation-duration:4.1s; animation-delay:-1.3s; }
#starsWrap canvas:nth-child(3){ animation-duration:5.3s; animation-delay:-2.2s; }
#starsWrap canvas:nth-child(4){ animation-duration:3.6s; animation-delay:-.6s; }
#starsWrap canvas:nth-child(5){ animation-duration:6.4s; animation-delay:-3.1s; }
@keyframes tw{ from{ opacity:.28; } to{ opacity:1; } }
#shoot{ position:absolute; left:0; top:0; width:130px; height:2px; border-radius:2px; opacity:0; pointer-events:none;
  background:linear-gradient(90deg, rgba(255,240,250,0), rgba(255,248,230,.95)); transform-origin:100% 50%; }
#shoot.go{ animation:shoot 1.05s cubic-bezier(.3,.1,.4,1) forwards; }
@keyframes shoot{ 0%{ opacity:0; transform:translate3d(0,0,0) rotate(var(--sa,-27deg)) scaleX(.3); } 20%{ opacity:1; }
  100%{ opacity:0; transform:translate3d(var(--sx,-220px),var(--sy,110px),0) rotate(var(--sa,-27deg)) scaleX(1); } }
#clouds{ width:100%; }
#clouds svg{ position:absolute; overflow:visible; }
.wisp{ animation:drift linear infinite alternate; }
@keyframes drift{ from{ transform:translate3d(-4vw,0,0); } to{ transform:translate3d(4vw,0,0); } }

#moon{ width:0; height:0; }
#moonInner{ position:absolute; transform:translate(-50%,-50%); animation:bob 7s ease-in-out infinite; }
#moonInner svg{ display:block; width:100%; height:100%; overflow:visible; }
@keyframes bob{ 0%,100%{ transform:translate(-50%,-50%) rotate(-3deg); } 50%{ transform:translate(-50%,-56%) rotate(2deg); } }
.zz{ font-family:var(--read); font-style:italic; font-weight:600; fill:#f3dfa6; opacity:0; animation:zz 6s ease-out infinite; }
.zz.z2{ animation-delay:2s; } .zz.z3{ animation-delay:4s; }
@keyframes zz{ 0%{ opacity:0; transform:translate(0,0) scale(.6); } 15%{ opacity:.85; } 70%{ opacity:0; transform:translate(14px,-26px) scale(1.15); } 100%{ opacity:0; } }
#moon .lid-open{ opacity:0; transition:opacity .2s; } #moon .lid-shut{ transition:opacity .2s; }
#moon.awake .lid-open{ opacity:1; } #moon.awake .lid-shut{ opacity:0; }

#table{
  width:150vw; left:-25vw;
  border-radius:50% 50% 0 0 / 46px 46px 0 0;
  background:
    radial-gradient(56% 30% at 50% 0%, rgba(220,140,200,.34), rgba(220,140,200,0) 72%),
    linear-gradient(180deg, #5b2a60 0%, #4b2153 12%, #3d1a46 38%, #31133a 66%, #240c2b 100%);
  box-shadow:
    0 -1.5px 0 rgba(240,206,140,.75),
    0 -3px 0 rgba(120,70,40,.35),
    0 -16px 40px rgba(16,8,32,.45);
}
#table::before{  /* velvet nap: procedural noise, set from JS */
  content:''; position:absolute; inset:0; border-radius:inherit;
  background-image:var(--velvet); background-size:220px 220px; opacity:.5;
}
#table::after{   /* a soft lip of light along the back edge */
  content:''; position:absolute; left:0; right:0; top:0; height:70px; border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,214,170,.16), rgba(255,214,170,0));
}

#ball{ position:absolute; width:var(--bs,52px); height:calc(var(--bs,52px) * 1.32); margin-left:calc(var(--bs,52px) / -2); }
#ball{ transition:opacity .9s ease; }
#ball.away{ opacity:0; }
#ball .halo{ position:absolute; left:50%; top:38%; width:300%; height:300%; transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(214,180,255,.42), rgba(255,170,210,.16) 55%, rgba(255,170,210,0)); animation:halo 4.6s ease-in-out infinite; }
@keyframes halo{ 0%,100%{ opacity:.75; transform:translate(-50%,-50%) scale(.94); } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.06); } }
#ball .orb{ position:absolute; left:0; top:0; width:100%; height:calc(var(--bs,52px)); border-radius:50%; overflow:hidden;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 22%),
    radial-gradient(circle at 60% 66%, rgba(255,184,214,.85), rgba(255,184,214,0) 55%),
    radial-gradient(circle at 50% 50%, #e8dcff 0%, #b9a2ea 52%, #7a62b8 100%);
  box-shadow: inset 0 -4px 10px rgba(60,30,110,.45), inset 0 2px 6px rgba(255,255,255,.5), 0 0 18px rgba(214,180,255,.55);
}
#ball .mist{ position:absolute; inset:-20%; opacity:.75; animation:spin 9s linear infinite;
  background:conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,226,246,.55) 12%, rgba(255,255,255,0) 30%, rgba(190,226,255,.5) 46%, rgba(255,255,255,0) 62%, rgba(255,240,200,.45) 80%, rgba(255,255,255,0)); }
@keyframes spin{ to{ transform:rotate(360deg); } }
#ball .stand{ position:absolute; left:-12%; width:124%; bottom:0; height:auto; }
#ball .msg{ position:absolute; left:50%; bottom:110%; transform:translate(-50%,6px) scale(.9); white-space:nowrap;
  font-family:var(--read); font-style:italic; font-weight:600; font-size:15px; color:#fdf3dc;
  padding:6px 12px 7px; border-radius:14px; background:rgba(44,28,74,.82); border:1px solid rgba(240,206,140,.45);
  box-shadow:0 8px 22px rgba(10,5,25,.45); opacity:0; transition:opacity .35s ease, transform .5s var(--ease-spring); }
#ball.say .msg{ opacity:1; transform:translate(-50%,0) scale(1); }
#ball.swirl .orb{ animation:orbPulse 1.4s ease-out; }
@keyframes orbPulse{ 0%{ box-shadow: inset 0 -4px 10px rgba(60,30,110,.45), 0 0 18px rgba(214,180,255,.55);} 30%{ box-shadow: inset 0 -4px 10px rgba(60,30,110,.25), 0 0 46px rgba(255,214,250,.95);} 100%{ box-shadow: inset 0 -4px 10px rgba(60,30,110,.45), 0 0 18px rgba(214,180,255,.55);} }

#moonMsg{ position:absolute; white-space:nowrap; transform:translate(0,0) scale(.9); transform-origin:0 0;
  font-family:var(--read); font-style:italic; font-weight:600; font-size:15px; color:#fdf3dc;
  padding:6px 12px 7px; border-radius:14px; background:rgba(44,28,74,.82); border:1px solid rgba(240,206,140,.45);
  box-shadow:0 8px 22px rgba(10,5,25,.45); opacity:0; transition:opacity .35s ease, transform .5s var(--ease-spring); }
#moonMsg.on{ opacity:1; transform:translate(0,0) scale(1); }

#pool{ position:absolute; left:0; top:0; width:100px; height:100px; margin:-50px 0 0 -50px; border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,214,186,.34), rgba(255,180,214,.14) 50%, rgba(255,180,214,0));
  will-change:transform; }
#fringe{ position:absolute; left:0; right:0; bottom:0; height:calc(var(--fh,30px) + env(safe-area-inset-bottom)); }
#fringe .band{ position:absolute; left:0; right:0; top:0; height:var(--fh,30px);
  background-image:var(--fringe); background-size:auto 100%; background-repeat:repeat-x; transform-origin:50% 0; animation:sway 5s ease-in-out infinite; }
#fringe .under{ position:absolute; left:0; right:0; top:0; bottom:0;
  background:linear-gradient(180deg, rgba(30,14,42,0) 0%, rgba(22,10,32,.65) 100%); }
@keyframes sway{ 0%,100%{ transform:skewX(-2.5deg); } 50%{ transform:skewX(2.5deg); } }

/* ═══════════════════════════════════════════════════════════════════════════
   cards. every card is: card (placement) › shadow, glow, tilt (3D: flip+tilt)
   › back + edge + front faces. holo layers only switch on for the few cards
   that are "live" (focused, slots, the XXII card).
   ═══════════════════════════════════════════════════════════════════════════ */
#stage{ position:absolute; inset:0; pointer-events:none; z-index:10; }
.card{
  position:absolute; left:0; top:0;
  width:var(--cw,100px); height:calc(var(--cw,100px) * 1.7);
  margin-left:calc(var(--cw,100px) / -2); margin-top:calc(var(--cw,100px) * -.85);
  transform-origin:50% 50%;
  perspective:calc(var(--cw,100px) * 6.5);
  pointer-events:none;
  will-change:transform;   /* cards are rastered once at full size and only ever scaled DOWN */
  --lx:50%; --ly:50%; --fx:50%; --fy:50%; --gx:0px; --gy:0px; --hi:1; --hyp:.3;
}
.card .cshadow{ position:absolute; left:-16%; right:-16%; top:-9%; bottom:-11%; border-radius:30%;
  background:radial-gradient(closest-side, rgba(12,4,24,.62), rgba(12,4,24,.28) 55%, rgba(12,4,24,0));
  transform-origin:50% 50%; }
.card .cglow{ position:absolute; left:-34%; right:-34%; top:-22%; bottom:-22%; border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,226,160,.75), rgba(255,190,220,.30) 50%, rgba(255,190,220,0));
  opacity:0; transition:opacity .35s ease; }
.card.lit .cglow{ opacity:1; }
.card .ctilt{ position:absolute; inset:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d; }
.card .face{
  position:absolute; inset:0; overflow:hidden;
  border-radius:calc(var(--cw,100px) * .075);
  -webkit-backface-visibility:hidden; backface-visibility:hidden;
  transform:translateZ(1.2px);
  will-change:transform;   /* keep the SVG raster when tilt/flip/scale change: no per-frame re-raster */
  isolation:isolate;
  box-shadow:0 0 0 .5px rgba(120,80,40,.35);
}
.card .front{ transform:rotateY(180deg) translateZ(1.2px); }
.card .face > svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.card .edge{ position:absolute; top:1.5%; bottom:1.5%; left:50%; width:2px; margin-left:-1px; display:none;
  background:linear-gradient(180deg, #f4dc9c, #c39448 50%, #f0d38f); transform:rotateY(90deg); border-radius:2px; }

/* glint: a one-shot travelling band, triggered on one card at a time by JS */
.card .face::after{
  content:''; position:absolute; top:-30%; bottom:-30%; left:-70%; width:90%; opacity:0;
  background:linear-gradient(100deg, rgba(255,255,255,0) 32%, rgba(255,250,235,.3) 48%, rgba(255,214,240,.14) 55%, rgba(255,255,255,0) 68%);
  transform:translate3d(-60%,0,0) rotate(8deg); pointer-events:none;
}
.card .face.gl::after{ animation:glint 1.15s cubic-bezier(.55,0,.35,1) forwards; }
@keyframes glint{ 0%{ opacity:1; transform:translate3d(-60%,0,0) rotate(8deg); } 100%{ opacity:1; transform:translate3d(330%,0,0) rotate(8deg); } }
.card.holo .face::after{ display:none; }

/* the holo stack — every per-frame change is a transform on an oversized child, so the
   compositor does the work: no repaints, the line-masks are rasterised once. */
.card .hx{ position:absolute; inset:0; display:none; pointer-events:none; }
.card.holo .hx{ display:block; }
.card.holo.up .back .hx, .card.holo:not(.up) .front .hx{ display:none; }
.hx > *, .hx i{ position:absolute; pointer-events:none; }
.hx .fm{ inset:0; overflow:hidden;
  -webkit-mask-image:var(--mask); mask-image:var(--mask);
  -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
.hx .fm i{ left:-80%; top:-80%; width:260%; height:260%; will-change:transform; }
.hx .fa{ background-image:linear-gradient(112deg, rgba(255,255,255,0) 36%, rgba(255,122,192,.95) 41.5%, rgba(255,226,140,.98) 45.5%,
  rgba(255,252,236,1) 47.5%, rgba(124,232,181,.95) 50%, rgba(108,192,255,.95) 54%, rgba(185,140,255,.9) 58.5%, rgba(185,140,255,0) 64%); }
.hx .fb{ background-image:repeating-linear-gradient(112deg, rgba(255,122,192,.13) 0, rgba(255,214,110,.11) 9%, rgba(124,232,181,.13) 18%,
  rgba(108,192,255,.13) 27%, rgba(185,140,255,.13) 36%, rgba(255,122,192,.13) 45%); }
.hx .sh{ left:-70%; top:-70%; width:240%; height:240%; will-change:transform; mix-blend-mode:soft-light; opacity:.6;
  background-image:linear-gradient(112deg, rgba(255,150,210,0) 30%, rgba(255,150,210,.6) 39%, rgba(255,226,150,.55) 45%,
    rgba(150,236,200,.55) 51%, rgba(150,196,255,.6) 57%, rgba(200,160,255,0) 68%); }
.hx .gm{ left:-25%; top:-25%; width:150%; height:150%; will-change:transform; mix-blend-mode:color-dodge; overflow:hidden;
  -webkit-mask-image:radial-gradient(closest-side, #000 0%, rgba(0,0,0,.72) 28%, rgba(0,0,0,.14) 64%, rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(closest-side, #000 0%, rgba(0,0,0,.72) 28%, rgba(0,0,0,.14) 64%, rgba(0,0,0,0) 100%); }
.hx .gm i{ left:-40%; top:-40%; width:180%; height:180%; will-change:transform; background-image:var(--glitter); background-size:84px 84px; }
.hx .gl{ left:-50%; top:-50%; width:200%; height:200%; will-change:transform, opacity; mix-blend-mode:overlay;
  background:radial-gradient(closest-side, rgba(255,253,245,.58) 0%, rgba(255,250,240,.18) 26%, rgba(255,255,255,0) 58%); }
.card.katie .hx .sh{ opacity:.85; }
.card.katie .hx .fm i.fa{ width:220%; height:220%; left:-60%; top:-60%; }
.card.katie .hx .gm i{ background-size:70px 70px; }

/* card typography (inside the face SVGs) */
.c-num{ font-family:var(--title); font-weight:700; fill:#9a6c26; letter-spacing:.06em; }
.c-the{ font-family:var(--read); font-style:italic; font-weight:600; fill:#9a6c26; }
.c-ttl{ font-family:var(--title); font-weight:700; fill:#4a2f4d; letter-spacing:.035em; }
.c-katie{ font-family:var(--deco); font-weight:700; fill:#5a3463; letter-spacing:.06em; }

/* empty slot placeholders */
.ph{ position:absolute; left:0; top:0; border-radius:8px; opacity:0; transition:opacity .6s ease;
  border:1.2px dashed rgba(243,223,166,.55);
  background:radial-gradient(closest-side, rgba(255,226,170,.10), rgba(255,226,170,0));
  box-shadow:inset 0 0 18px rgba(255,214,160,.08); }
.ph.on{ opacity:1; }
.ph.ping{ animation:ping .9s ease-out; }
@keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(255,226,160,.6), inset 0 0 18px rgba(255,214,160,.2); } 100%{ box-shadow:0 0 0 22px rgba(255,226,160,0), inset 0 0 18px rgba(255,214,160,.08); } }

/* ═══════════════════════════════════════════════════════════════════════════
   words
   ═══════════════════════════════════════════════════════════════════════════ */
#texts{ position:absolute; inset:0; pointer-events:none; z-index:30; }
.t{ position:absolute; left:0; right:0; text-align:center; padding:0 20px; text-wrap:balance; }
.ln, #caption p, .fread{ text-wrap:balance; }
#title{ top:0; transition:opacity .9s ease, transform 1.3s cubic-bezier(.6,0,.2,1); }
#title h1{
  font-family:var(--deco); font-weight:700;
  font-size:clamp(25px, 7.3vw, 54px); line-height:1.08; letter-spacing:.015em;
  background:linear-gradient(180deg, #fff7dc 0%, #f6dc98 42%, #ddb46a 68%, #f7e4b0 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,214,150,.38)) drop-shadow(0 2px 1.5px rgba(16,8,36,.55));
  padding:0 .1em;
}
#title p{
  margin-top:.3em;
  font-family:var(--read); font-style:italic; font-weight:500;
  font-size:clamp(19px, 5.3vw, 31px); letter-spacing:.02em;
  color:#f4e3bd; opacity:.94;
  text-shadow:0 0 14px rgba(255,220,160,.35), 0 1px 2px rgba(16,8,36,.6);
}
#title .orn{ display:block; margin:.5em auto 0; width:clamp(90px, 30vw, 170px); height:auto; opacity:.85; }
#title.away{ opacity:0; transform:translateY(-26px); }

#caption{ height:0; transition:top .9s var(--ease-out); }

#caption p.on{ opacity:1; transform:translateY(-50%); }

#caption p.in{ opacity:0; transform:translateY(calc(-50% + 10px)); transition:none; }

  color:rgba(243,223,166,.82); opacity:0; transition:opacity .6s ease, color .6s ease, transform .6s var(--ease-out); }

#hint{ font-family:var(--sans); font-weight:500; font-size:11px; letter-spacing:.24em; color:rgba(243,223,166,.85);

.pill{
  position:absolute; left:50%; transform:translate(-50%, 8px) scale(.96);

}
.pill.on{ opacity:1; transform:translate(-50%,0) scale(1); pointer-events:auto; }
.pill:active{ transform:translate(-50%,0) scale(.96); }
.pill::after{ content:''; position:absolute; inset:-2px; border-radius:inherit; pointer-events:none; border:1.5px solid rgba(243,214,150,.6);

#focus{ position:absolute; inset:0; z-index:32; pointer-events:none; }
#focus .veil{ position:absolute; inset:0; opacity:0; transition:opacity .55s ease;
  background:radial-gradient(90% 70% at 50% 40%, rgba(30,14,50,.72), rgba(12,4,24,.93)); }

#focus.on .veil{ opacity:1; }

#focus.on .flbl{ opacity:1; }

#fx{ position:absolute; left:0; top:0; z-index:40; pointer-events:none; }

// ═════════════════════════════════════════════════════════════════════════

(function () {

/* ═══════════════════════════════════════════════════════════════════════
   environment + tiny helpers
   ═══════════════════════════════════════════════════════════════════════ */
const QS = new URLSearchParams(location.search);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const $ = (id) => document.getElementById(id);
const n2 = (v) => Math.round(v * 100) / 100;

const capFirst = (t) => { t = String(t || '').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; };
if (QS.get('name')) CONFIG.herName = capFirst(QS.get('name').slice(0, 24));
const NAME = capFirst(CONFIG.herName) || 'you';
const ME = (CONFIG.myName || 'amit').toLowerCase();
const STILL = QS.get('still') === '1';
const GALLERY = QS.get('gallery') === '1';
const NOGLINT = QS.has('noglint');
const STAGE0 = QS.has('s') ? clamp(parseInt(QS.get('s'), 10) || 0, 0, 6) : null;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const COARSE = !!(window.matchMedia && matchMedia('(hover: none), (pointer: coarse)').matches);
let TILT_PIN = null;
if (QS.get('tilt')) {
  const t = QS.get('tilt').split(',').map(Number);
  if (t.length === 2 && t.every(isFinite)) TILT_PIN = [clamp(t[0], -1, 1), clamp(t[1], -1, 1)];
}
function fill(str, extra) {
  return String(str).replace(/\{(\w+)\}/g, (m, k) =>
    k === 'name' ? NAME : k === 'me' ? ME : k === 'distance' ? String(CONFIG.distance).replace(/ /g, '\u00a0') : (extra && extra[k] != null ? extra[k] : m));
}

// easings
const E = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out3: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in3: t => t * t * t,
  in2: t => t * t,
  outBack: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};

// seeded rng — the ambient field + card specks are identical on every load
let _seed = 0x5eed1e;
function srnd() {
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);

const srange = (a, b) => a + srnd() * (b - a);
const rand = (a, b) => a + Math.random() * (b - a);

/* ═══════════════════════════════════════════════════════════════════════
   ART — every illustration is inline SVG drawn in a 200×340 card space.
   gold line-art (gradient strokes), pastel fills, cute faces in plum ink.
   each drawing is a string so it can be both a <g> in <defs> and a white

   ═══════════════════════════════════════════════════════════════════════ */
const P = {
  rose: '#f4a7b9', roseD: '#ea8aa3', roseL: '#fbd5de', roseXL: '#fde8ee',
  lilac: '#c3b1e1', lilacD: '#ab95d5', lilacL: '#e2d8f3',
  butter: '#f6dc9a', butterD: '#eec873', butterL: '#fbecc6',
  mint: '#bfe3d0', mintD: '#9fd0b8', mintL: '#e0f2e8',
  sky: '#b8d4f2', skyD: '#96bde9', skyL: '#dcebfa',
  cream: '#fffaf0', white: '#fffdf8', peach: '#fcd7c2', honey: '#f3d4a7', honeyL: '#fbe9cc',
};
const INK = '#5a3a5c';

const ink = (w) => ` stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;

// ── shape helpers ───────────────────────────────────────────────────────
function starP(cx, cy, R, r, rot, round, pts) {
  const N = (pts || 5) * 2, v = [];
  for (let i = 0; i < N; i++) {
    const a = ((rot == null ? -90 : rot) + i * 360 / N) * Math.PI / 180, rr = i % 2 ? r : R;
    v.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  if (!round) return 'M' + v.map(p => n2(p[0]) + ' ' + n2(p[1])).join(' L') + 'Z';
  let d = '';
  for (let i = 0; i < N; i++) {
    const p = v[i], a = v[(i - 1 + N) % N], b = v[(i + 1) % N];
    const t = i % 2 ? round * .55 : round;
    const p1 = [p[0] + (a[0] - p[0]) * t, p[1] + (a[1] - p[1]) * t];
    const p2 = [p[0] + (b[0] - p[0]) * t, p[1] + (b[1] - p[1]) * t];
    d += (i ? 'L' : 'M') + n2(p1[0]) + ' ' + n2(p1[1]) + ' Q' + n2(p[0]) + ' ' + n2(p[1]) + ' ' + n2(p2[0]) + ' ' + n2(p2[1]) + ' ';
  }
  return d + 'Z';
}
function heartP(cx, cy, w) {   // centred heart, w wide, ~0.8w tall
  const k = (x, y) => n2(cx + x * w) + ' ' + n2(cy + y * w);

const stops = (a) => a.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}"${s[2] != null ? ` stop-opacity="${s[2]}"` : ''}/>`).join('');

/* ── card titles: measured once the fonts land, so they always fit ─────── */
const TFIT = {};
const mctx = document.createElement('canvas').getContext('2d');
function titleLines(title) {
  let t = String(title).trim(), the = false;
  if (/^the\s+/i.test(t)) { the = true; t = t.replace(/^the\s+/i, ''); }
  t = t.toUpperCase();
  let lines = [t];
  if (t.length > 11 && t.indexOf(' ') > 0) {
    const w = t.split(' '); let best = null;
    for (let i = 1; i < w.length; i++) {
      const a = w.slice(0, i).join(' '), b = w.slice(i).join(' '), sc = Math.max(a.length, b.length);
      if (!best || sc < best.sc) best = { a, b, sc };
    }
    lines = [best.a, best.b];
  }
  return { the, lines };
}
function measure(font, txt, track) {
  mctx.font = font;
  return mctx.measureText(txt).width + Math.max(0, txt.length - 1) * track;
}
function fitTitle(def) {
  if (def.id === 'katie') {
    const t = NAME.toUpperCase();
    const w = measure('700 100px "Cinzel Decorative", Cinzel, Georgia, serif', t, 6);
    return (TFIT.katie = { lines: [t], size: n2(Math.min(30, 138 / (w / 100))) });
  }
  const tl = titleLines(def.title);
  const two = tl.lines.length > 1, maxS = two ? 15.5 : 19;
  let wmax = 0;
  tl.lines.forEach(l => { wmax = Math.max(wmax, measure('700 100px Cinzel, Georgia, serif', l, 3.5)); });
  tl.size = n2(Math.min(maxS, 146 / (wmax / 100)));
  return (TFIT[def.id] = tl);
}
function titleMarkup(def) {
  const f = TFIT[def.id] || fitTitle(def);
  const num = def.id === 'katie' ? CONFIG.katieNumeral : def.num;
  let s = `<text class="c-num" x="100" y="29.4" text-anchor="middle" font-size="11.5">${num}</text>`;
  if (def.id === 'katie') {
    return s + `<text class="c-the" x="100" y="287" text-anchor="middle" font-size="10.5">the one and only</text>` +
      `<text class="c-katie" x="100" y="314" text-anchor="middle" font-size="${f.size}">${f.lines[0]}</text>`;
  }
  const two = f.lines.length > 1;
  if (f.the) s += `<text class="c-the" x="100" y="${two ? 284.6 : 288}" text-anchor="middle" font-size="${two ? 10.5 : 11}">the</text>`;
  if (two) {
    const y1 = f.the ? 301.2 : 296, y2 = f.the ? 316.8 : 313;
    s += `<text class="c-ttl" x="100" y="${y1}" text-anchor="middle" font-size="${f.size}">${f.lines[0]}</text>`;
    s += `<text class="c-ttl" x="100" y="${y2}" text-anchor="middle" font-size="${f.size}">${f.lines[1]}</text>`;
  } else {
    s += `<text class="c-ttl" x="100" y="${f.the ? 309 : 304}" text-anchor="middle" font-size="${f.size}">${f.lines[0]}</text>`;

/* ═══════════════════════════════════════════════════════════════════════

  return null;
}
function hoverTilt(x, y) {
  const c = liveUnder(x, y);
  if (!c) { TILT.hover = null; return; }
  const w = c.cw * c.p.s;
  TILT.hover = [clamp((x - c.p.x) / (w * .5), -1, 1), clamp((y - c.p.y) / (w * .85), -1, 1)];
}
function interactiveAt(x, y) {
  const ph = S.phase;
  if (inMoon(x, y) || inBall(x, y)) return true;
  if (ph === 'intro') return deckHit(x, y);
  if (ph === 'fan') return !!fanHit(x, y);
  if (ph === 'placed' || ph === 'revealed') return slotHit(x, y) >= 0 || (ph === 'revealed' && !!fanHit(x, y));
  if (ph === 'tableau') return S.tab.some(c => c.hit(x, y, 2));
  if (ph === 'focus') return true;
  if (ph === 'finale') return kc.hit(x, y, 0);
  return false;
}
window.addEventListener('pointermove', (e) => {
  const x = e.clientX, y = e.clientY;
  if (!ptr || e.pointerId !== ptr.id) {
    if (e.pointerType === 'mouse') {
      if (S.phase === 'fan' && !S.busy) hover(fanHit(x, y)); else hoverTilt(x, y);
      app.style.cursor = interactiveAt(x, y) ? 'pointer' : 'default';
    }
    return;
  }
  if (!ptr.moved && Math.hypot(x - ptr.x0, y - ptr.y0) > 9) ptr.moved = true;
  if (ptr.mode === 'fan') { const c = fanHit(x, y); if (c) hover(c); }
  else if ((ptr.mode === 'focus' && ptr.onCard) || ptr.mode === 'katie') {
    if (ptr.moved) TILT.drag = [clamp((x - ptr.x0) / 80, -1.2, 1.2), clamp((y - ptr.y0) / 100, -1.2, 1.2)];
  }
});
function endPtr(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  const p = ptr, up = e.type === 'pointerup';
  ptr = null; TILT.drag = null;
  if (p.mode === 'fan') { const c = hovered; if (c && up) pick(c); else hover(null); }
  else if (p.mode === 'focus') { if (!p.moved && up) closeFocus(); }
  else if (p.mode === 'katie') { if (!p.moved && up) katieTap(); }
}
window.addEventListener('pointerup', endPtr);
window.addEventListener('pointercancel', endPtr);
window.addEventListener('blur', () => { TILT.drag = null; TILT.hover = null; });
app.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  e.preventDefault(); SND.init(); S.lastInput = performance.now();
  if (S.busy) return;
  const ph = S.phase;
  if (ph === 'intro') shuffle();
  else if (ph === 'fan') pick(S.fan[(S.fan.length / 2) | 0]);
  else if (ph === 'placed') { const k = S.revealed.indexOf(false); if (k >= 0) reveal(k); }
  else if (ph === 'focus') closeFocus();
  else if (ph === 'revealed') twist();
  else if (ph === 'tableau') finale();
  else if (ph === 'finale') again();
});
el.twistBtn.addEventListener('click', () => { SND.init(); S.lastInput = performance.now(); SND.chime(0, 79, .45); twist(); });
el.moreBtn.addEventListener('click', () => { SND.init(); S.lastInput = performance.now(); finale(); });
el.again.addEventListener('click', () => { SND.init(); again(); });
el.tiltPill.addEventListener('click', () => { SND.init(); el.tiltPill.innerHTML = '✨ …'; enableGyro(); });
el.mute.addEventListener('click', () => { SND.init(); const m = !SND.muted; SND.setMuted(m); el.mute.classList.toggle('muted', m); if (!m) SND.twinkle(0, .3); });

// ── idle: if she hasn't touched anything for a few seconds, a nudge ─────
function idleHints(now) {
  if (S.busy || STILL || ptr) return;
  if (now - S.lastInput < 4200 || now - S.hinted < 5600) return;
  S.hinted = now;
  if (S.phase === 'intro') deck.forEach((c, i) => later(i * 16, () => { kick(c, 'y', -(240 + i * 8)); kick(c, 'r', (i % 2 ? 1 : -1) * 14); }));
  else if (S.phase === 'fan') S.fan.forEach((c, i) => later(i * 42, () => kick(c, 'lift', 5.5)));
  else if (S.phase === 'placed') {
    const k = S.revealed.indexOf(false), c = S.slots[k];
    if (c) { kick(c, 'r', 90); later(140, () => kick(c, 'r', -80)); c.el.classList.add('lit'); later(1000, () => c.el.classList.remove('lit')); }
  }
}

// ── glints: a soft travelling shine on one resting card at a time ────────
let glintT = 0;
function glints(now) {
  if (STILL || RM || NOGLINT || now < glintT || document.body.classList.contains('focusing')) return;
  glintT = now + rand(420, 900);
  let pick = null;
  for (let tries = 0; tries < 8 && !pick; tries++) {
    const c = ALL[(Math.random() * ALL.length) | 0];
    if (!c || c.live || c.path || !c.rest || c.p.op < .9 || c === big || c === kc) continue;
    if (c.role === 'deck' && c !== deck[deck.length - 1]) continue;
    pick = c;
  }
  if (!pick) return;
  const f = pick.up ? pick.front : pick.back;
  f.classList.remove('gl'); void f.offsetWidth; f.classList.add('gl');
  setTimeout(() => f.classList.remove('gl'), 1250);
}

/* ═══════════════════════════════════════════════════════════════════════
   LOOP
   ═══════════════════════════════════════════════════════════════════════ */
let lastT = 0, AT = 2.6, raf = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > .05) dt = .05;
  if (!STILL) AT += dt;
  BREATH = STILL || RM ? 0 : Math.sin(AT * 1.6);
  FLOAT = STILL || RM ? 0 : Math.sin(AT * .9);
  stepCamera(now); placeScene();
  stepTilt(AT, dt);
  for (let i = 0; i < ALL.length; i++) {
    const c = ALL[i], was = c.rest && !c.path;
    c.step(dt, now);
    if (c.live) applyHolo(c);
    if (!was || c.live || c.breath || c.float) c.render();
  }
  stepShoot(dt);
  stepFx(dt); drawFx();
  idleHints(now);
  glints(now);
}
function start() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });

/* ═══════════════════════════════════════════════════════════════════════
   ?s= — every key state, built instantly in its settled pose
   ═══════════════════════════════════════════════════════════════════════ */
function applyState(n) {
  document.body.classList.add('instant');
  clearTimers();
  dealSpread();
  intro(true);
  if (n >= 1) {
    el.title.classList.add('away'); hideHint();
    setCamera('read', true); placePool('read');
    fanOut(true);
  }
  if (n >= 2) {
    [S.fan[3], S.fan[8], S.fan[11]].forEach((c, k) => {
      S.fan.splice(S.fan.indexOf(c), 1);
      S.slots[k] = c; c.role = 'slot'; c.slot = k; c.z = 40 + k; c.shade = 1; c.setFace(S.read[k]); c.snap(slotPose(k));
    });
    S.picks = 3;
    S.fan.forEach((c, i) => { c.idx = i; c.z = 10 + i; c.snap(fanPose(i, S.fan.length)); });
    showPH(false);
    S.phase = 'placed'; setCaption(CONFIG.turnOver, L.capY); showHint(CONFIG.tapCard, L.midY);
  }
  if (n === 3) {
    S.revealed[0] = true; S.slots[0].snap(slotPose(0)); hideHint();
    openFocus(S.slots[0], CONFIG.slots[0], S.slots[0].def.reading, true);
  }
  if (n >= 4) { S.revealed = [true, true, true]; S.slots.forEach((c, k) => c.snap(slotPose(k))); afterThree(true); }
  if (n >= 5) twist(true);
  if (n >= 6) finale(true);
  S.busy = false;
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('instant')));
}

/* ── QA gallery: every face, the back, the XXII card ───────────────────── */
function gallery() {
  el.gallery.classList.add('on');
  const gw = Math.round(clamp((L.W - 70) / (L.W > 900 ? 5 : 2), 120, 250));
  el.gallery.style.setProperty('--gw', gw + 'px');
  CONFIG.cards.concat([DEF.katie, null]).forEach(d => {
    const g = document.createElement('div'); g.className = 'g'; el.gallery.appendChild(g);
    const c = new Card(g, gw, d && d.id === 'katie' ? 'kbackS' : 'backS');
    if (d) { c.setFace(d); if (d.id === 'katie') c.el.classList.add('katie'); }
    c.snap({ x: 0, y: 0, s: 1, fl: d ? 1 : 0, op: 1 });
    c.el.style.left = '50%'; c.el.style.top = '50%';
    if (QS.get('holo') === '1') c.setLive(true);
    ALL.push(c);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT + RESIZE
   ═══════════════════════════════════════════════════════════════════════ */
function poolName() { return cam.name === 'intro' ? 'intro' : cam.name === 'finale' ? 'finale' : 'read'; }
function relayout() {
  ALL.forEach(c => { if (c.path && c !== kc) c.path = null; });
  const ph = S.phase, fin = ph === 'spiral' || ph === 'finale';
  deck.concat(S.tab).forEach(c => {
    if (fin) return;
    if (c.role === 'deck') c.to(deckPose(c.idx, deck.length));
    else if (c.role === 'fan') c.to(fanPose(c.idx, S.fan.length));
    else if (c.role === 'slot') c.to(slotPose(c.slot));
    else if (c.role === 'trio') c.to(trioPose(c.slot));
    else if (c.role === 'tab') c.to(tabPose(c.idx));
  });
  if (ph === 'focus') { big.to({ x: L.focus.x, y: L.focus.y, s: 1 }); layoutFocusText(); }
  if (fin) {
    kc.to(katiePose());
    const on = finLines.map(n => n.classList.contains('on')), ag = el.again.classList.contains('on');
    buildFinaleText();
    finLines.forEach((n, i) => n.classList.toggle('on', !!on[i]));
    el.again.classList.toggle('on', ag);
  }
  el.caption.style.top = n2(ph === 'wave' || ph === 'tableau' ? L.capTwistY : L.capY) + 'px';
  const lblOn = el.lbl0.classList.contains('on');
  showLabels(lblOn);
  if (el.hint.classList.contains('on')) el.hint.style.top = n2(ph === 'intro' ? L.hintY : L.midY) + 'px';
  el.twistBtn.style.top = n2(L.midY - 24) + 'px';
  el.moreBtn.style.top = n2(L.moreY - 24) + 'px';
}
let rzT = 0;
function onResize() {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    const W = window.innerWidth, H = window.innerHeight;
    if (Math.abs(W - L.W) < 2 && Math.abs(H - L.H) < 2) return;
    L = computeLayout();
    buildScene(); resizeCanvases();
    deck.forEach(c => c.setCW(L.cw)); big.setCW(L.focus.w); kc.setCW(L.katie.w);
    cam.hz = L.hz[cam.name]; cam.moving = false; cam.dirty = true;
    placePH(); placeTitle(); placePool(poolName());
    relayout();
  }, 140);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

function refreshFaces() {
  for (const k in TFIT) delete TFIT[k];
  ALL.forEach(c => { if (c.def) { const d = c.def; c.def = null; c.setFace(d); } });
  placeTitle();
  if (S.phase === 'finale') relayout();
}
function boot() {
  buildDefs(); buildTextures();
  L = computeLayout();
  el.titleH.textContent = CONFIG.title;
  el.titleFor.textContent = fill(CONFIG.forLine);
  document.title = document.title;
  buildScene(); buildMoon(); resizeCanvases();
  for (let i = 0; i < 15; i++) {
    const c = new Card(el.stage, L.cw);
    c.el.style.setProperty('--gd', (-(i * 0.43) % 7.5).toFixed(2) + 's');
    deck.push(c);
  }
  big = new Card(el.focus, L.focus.w); big.snap({ op: 0 }); big.tiltAmt = 1;
  kc = new Card(el.finale, L.katie.w, 'kbackS'); kc.el.classList.add('katie'); kc.setFace(DEF.katie); kc.snap({ op: 0 });
  ALL = deck.concat([big, kc]);
  placePH(); placeTitle(); placePool('intro');
  cam.hz = L.hz.intro; cam.dirty = true;
  if (SND.muted) el.mute.classList.add('muted');
  if (STILL || QS.has('noanim')) document.body.classList.add('still');
  if (GALLERY) gallery();
  if (STAGE0 != null) { applyState(STAGE0); el.intro.style.transition = 'none'; el.intro.classList.add('gone'); }
  else { dealSpread(); intro(false); requestAnimationFrame(() => el.intro.classList.add('gone')); }
  S.lastInput = performance.now();
  start();
  window.__bday = {
    get state() { return S.phase; }, go: (n) => applyState(n), tilt: (x, y) => { TILT_PIN = [x, y]; },
    get layout() { return L; }, S, deck: () => deck,
  };
}
boot();
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('700 20px Cinzel'), document.fonts.load('700 20px "Cinzel Decorative"'),
    document.fonts.load('italic 500 20px "Cormorant Garamond"'), document.fonts.load('italic 600 20px "Cormorant Garamond"'),
  ]).then(() => refreshFaces()).catch(() => {});
}
})();
</script>
