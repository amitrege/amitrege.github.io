<!DOCTYPE html>
<!--
  a garden for Katie
  ─────────────────────────────────────────────────────────────────────────
  a soft dawn meadow. wherever she touches, a seed drops and a flower grows
  (peony, ranunculus, tulip, cosmos, sweet pea, daisy, forget-me-not) — each
  one unique, all swaying. every bloom lets a little word about her float up.
  after a handful: "make a bouquet 💐". her flowers lift, fly together into a
  hand-tied dome, paper folds round them, a satin ribbon wraps the stems and
  ties itself into a bow, a card swings from it — and then the whole meadow
  answers. the line is saved for the very end.

  canvas 2D (DPR ≤ 2) for everything that grows + an HTML overlay for type.
  sound is Web Audio synthesis (no files). no build step, no other files.

  DEBUG / SCREENSHOT HOOKS  (query params, combinable — e.g. ?s=4&still=1)
    ?s=0      intro: empty meadow, one butterfly, "hi Katie." + the hint.
    ?s=1      a few flowers mid-growth (a sprout, buds, two opening, one open).
    ?s=2      full garden: 12 blooms, butterflies (two landed), floating words,
              the "make a bouquet" button showing.
    ?s=3      the bouquet assembling, frozen mid-flight (tap to let it play).
              add &t=SECONDS to freeze anywhere on the bouquet timeline:
                0.3–2.9 flight · 2.6–3.4 greenery · 3.3–4.4 paper folds in ·
                4.4–6.2 ribbon wraps the stems · 6.2–7.8 the bow ties itself ·
                7.9 cinch · 8.2 card drops · 8.6 the meadow answers · 9.4+ note
    ?s=4      the end: finished bouquet, bow, card, the note, "grow another ↺".
    ?still=1  freezes ambient motion (wind, butterflies, motes, drifting words)
              at a good-looking frame. layout is identical with or without it.
    ?mute=1   no sound.        ?far=0   the not-long-distance copy.
    ?name=X   her name (first letter capitalised — "Katie").
  window.__garden = { go(n, t), info(), plant(x, y), bouquet() } for scripted QA.
  every ?s= state applies instantly (transitions suppressed for a frame), so a
  screenshot taken ~2s after load is already right.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8d8ee">
<title>i grew you something 🌷</title>
<meta property="og:type" content="website">
<meta property="og:title" content="i grew you something 🌷">
<meta property="og:description" content="(touch the ground. something will grow.)">
<meta name="description" content="(touch the ground. something will grow.)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Parisienne&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --serif:'Cormorant Garamond','Cormorant','Iowan Old Style',Georgia,'Times New Roman',serif;
    --script:'Parisienne','Snell Roundhand','Apple Chancery','Segoe Script',cursive;
    --sans:'Jost',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    --ink:#673754; --ink2:#8b5a76; --rose:#b6557d;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#a7b98b}
  body{
    position:fixed;inset:0;font-family:var(--sans);color:var(--ink);
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    touch-action:none;
  }
  #cv{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  button{font:inherit;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:2px solid rgba(182,85,125,.8);outline-offset:3px}

  /* ── intro ─────────────────────────────────────────────────────── */
  #intro{position:absolute;left:0;right:0;top:calc(var(--sat) + max(58px, 12.5vh));text-align:center;padding:0 22px;
         transition:opacity 1s ease, transform 1.2s cubic-bezier(.3,.7,.3,1)}
  #intro h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(50px,14vw,92px);line-height:1;
            letter-spacing:-.012em;color:var(--ink);
            text-shadow:0 1px 0 rgba(255,255,255,.55),0 0 34px rgba(255,247,242,.95)}
  #intro p{margin-top:.42em;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(22px,6vw,32px);
           color:var(--ink2);text-shadow:0 0 18px rgba(255,248,244,1),0 0 4px rgba(255,248,244,.8)}
  #intro .w{display:inline-block;opacity:0;transform:translateY(16px) scale(.96);
            transition:opacity 1.1s ease, transform 1.3s cubic-bezier(.2,1.25,.3,1)}
  #intro.show .w{opacity:1;transform:none}
  #intro.gone{opacity:0;transform:translateY(-22px)}

  /* ── pills: hint + bouquet button ──────────────────────────────── */
  .pill{position:absolute;left:50%;bottom:calc(var(--sab) + 26px);display:inline-flex;align-items:center;gap:11px;
        padding:12px 19px 12px 15px;border-radius:999px;white-space:nowrap;
        background:rgba(255,250,247,.7);border:1px solid rgba(255,255,255,.88);
        box-shadow:0 10px 30px rgba(120,70,90,.16), inset 0 1px 0 #fff;
        -webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2);
        font:500 14.5px/1.2 var(--sans);letter-spacing:.012em;color:var(--ink);
        opacity:0;transform:translate(-50%,18px);
        transition:opacity .7s ease, transform .9s cubic-bezier(.2,1.3,.3,1)}
  .pill.show{opacity:1;transform:translate(-50%,0)}
  .pill.nudge{animation:nudge 1.3s cubic-bezier(.3,1.5,.4,1) 1}
  @keyframes nudge{0%{transform:translate(-50%,0)}22%{transform:translate(-50%,-9px) scale(1.04)}48%{transform:translate(-50%,0)}64%{transform:translate(-50%,-4px)}100%{transform:translate(-50%,0)}}
  .seed{position:relative;flex:0 0 auto;width:10px;height:13px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
        background:linear-gradient(160deg,#c49567,#7d5638);box-shadow:inset -1px -1px 0 rgba(0,0,0,.12);
        animation:bob 1.7s ease-in-out infinite}
  .seed::after{content:'';position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
               border:1.5px solid rgba(170,112,86,.55);animation:ring 1.7s cubic-bezier(.2,.7,.3,1) infinite}
  @keyframes bob{0%,100%{transform:translateY(-2px) rotate(-6deg)}50%{transform:translateY(2px) rotate(6deg)}}
  @keyframes ring{0%{transform:scale(.25);opacity:.95}100%{transform:scale(1.3);opacity:0}}
  #hintTxt{transition:opacity .35s ease}

  #bq{position:absolute;left:50%;bottom:calc(var(--sab) + 22px);min-height:56px;padding:0 28px;border-radius:999px;cursor:pointer;
      font:500 16.5px/1 var(--sans);letter-spacing:.012em;color:#64294a;white-space:nowrap;
      border:2px solid transparent;
      background:linear-gradient(180deg,#fffaf7 0%,#fde6ec 100%) padding-box,
                 linear-gradient(100deg,#f1b3c6,#e28fab 28%,#fde0e8 50%,#e28fab 72%,#f1b3c6) border-box;
      box-shadow:0 16px 36px rgba(150,70,100,.24),0 2px 6px rgba(150,70,100,.12),inset 0 1px 0 #fff,inset 0 -2px 0 rgba(220,140,165,.22);
      opacity:0;pointer-events:none;transform:translate(-50%,46px) scale(.86);
      transition:opacity .6s ease, transform 1s cubic-bezier(.2,1.4,.3,1)}
  #bq.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
  #bq.show:active{transform:translate(-50%,2px) scale(.95);transition-duration:.12s}
  #bq::after{content:'';position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;animation:halo 2.6s cubic-bezier(.2,.7,.3,1) infinite}
  @keyframes halo{0%{box-shadow:0 0 0 0 rgba(255,236,242,.85)}70%{box-shadow:0 0 0 16px rgba(255,236,242,0)}100%{box-shadow:0 0 0 0 rgba(255,236,242,0)}}
  #bq span{position:relative;display:inline-block}

  /* ── the note ──────────────────────────────────────────────────── */
  #note{position:absolute;z-index:1;text-align:center;opacity:0;visibility:hidden;transition:opacity .8s ease, visibility 0s linear .8s}
  #note.show{opacity:1;visibility:visible;transition-delay:0s}
  #note::before{content:'';position:absolute;inset:-34px -30px;z-index:-1;border-radius:50%;
                background:radial-gradient(closest-side,rgba(255,249,246,.86),rgba(255,249,246,.62) 55%,rgba(255,249,246,0))}
  #note .ln{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(24px,6.7vw,36px);
            line-height:1.16;color:var(--ink);opacity:0;transform:translateY(14px);
            transition:opacity 1.3s ease, transform 1.5s cubic-bezier(.2,1,.3,1)}
  #note .ln.hb{color:var(--rose);font-weight:600}
  #note .ln.hb:not(:first-child){margin-top:.5em}
  #note .ln.sig{font-family:var(--script);font-style:normal;font-weight:400;font-size:clamp(27px,7.2vw,38px);margin-top:.28em;color:var(--ink2)}
  #note .ln.on{opacity:1;transform:none}
  #again{margin-top:16px;min-height:46px;padding:0 20px;border-radius:999px;cursor:pointer;pointer-events:auto;
         background:rgba(255,255,255,.55);border:1px solid rgba(190,120,150,.38);color:var(--ink2);
         font:500 14.5px/1 var(--sans);letter-spacing:.03em;opacity:0;transform:translateY(10px);
         transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,1.3,.3,1), background .3s ease}
  #again.on{opacity:1;transform:none}
  #again:active{background:rgba(255,255,255,.85)}

  /* ── mute ──────────────────────────────────────────────────────── */
  #mute{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 8px);width:44px;height:44px;border-radius:50%;border:0;
        display:grid;place-items:center;cursor:pointer;pointer-events:auto;color:var(--ink2);opacity:.82;
        background:rgba(255,252,250,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.72);
        -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #mute svg{width:20px;height:20px;display:block}
  #mute .off{display:none}
  body.muted #mute .on{display:none}
  body.muted #mute .off{display:block}

  #fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;
            background:linear-gradient(#e3d5f0,#f6cfd6 55%,#fde7d9);font-family:var(--serif);font-style:italic;font-size:28px;color:var(--ink)}

  /* ── modes ─────────────────────────────────────────────────────── */
  [hidden]{display:none !important}
  body.instant *, body.instant *::before, body.instant *::after{transition:none !important;animation:none !important}
  body.still .seed, body.still .seed::after, body.still #bq::after{animation:none !important}
  @media (prefers-reduced-motion: reduce){
    .seed, .seed::after, #bq::after{animation:none !important}
    .pill.nudge{animation:none}
  }
  @media (max-height:600px){ #intro{top:calc(var(--sat) + 40px)} }
</style>
</head>
<body>
<canvas id="cv" aria-label="a dawn meadow. touch the ground to plant a flower."></canvas>
<div id="ui">
  <div id="intro"><h1 id="hi"></h1><p id="sub"></p></div>
  <div id="hint" class="pill" role="status"><span class="seed" aria-hidden="true"></span><span id="hintTxt"></span></div>
  <button id="bq" type="button"><span id="bqTxt"></span></button>
  <div id="note" aria-live="polite"><div id="noteLines"></div><button id="again" type="button"></button></div>
  <button id="mute" type="button" aria-label="sound on / off">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor" fill-opacity=".16"/><path d="M15.6 9.3a3.9 3.9 0 0 1 0 5.4M18.2 6.9a7.3 7.3 0 0 1 0 10.2"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor" fill-opacity=".16"/><path d="M16 9.6l4.6 4.8M20.6 9.6L16 14.4"/></svg>
  </button>
</div>
<div id="fallback" hidden></div>
<script>
// ══ customise me ══════════════════════════════════════════
const CONFIG = {
  herName: "Katie",   // always written with a capital K
  myName: "amit",
  farAway: true,   // long-distance lines on/off (each has a local alternative)

  intro:      ["hi {her}.", "touch the ground."],
  introAgain: ["again? okay.", "touch the ground."],
  hint:       "touch the ground to plant 🌱",
  rowHint:    "psst — drag along the ground for a whole row",
  bouquetBtn: "make a bouquet 💐",
  card:       "for {her}",
  // one floats up from every bloom (shuffled, no repeats until the deck runs out)
  words: ["kind", "funny", "radiant", "brave", "clever", "warm", "gorgeous", "gentle",
          "sunny", "lovely", "fierce", "sweet", "{her}", "magic", "golden", "soft-hearted",
          "dazzling", "silly (the good kind)", "adored", "one of a kind"],
  // the end. the line with "birthday" is set in rose; the "— " line is the signature.
  finalFar:  ["i couldn't bring you flowers,", "so i grew you some.", "happy birthday, {her}.", "— {me}"],
  finalNear: ["happy birthday, {her}.", "every single one of these is for you.", "— {me}"],
  replay: "grow another ↺",

  bouquetAfterBlooms: 7,   // the bouquet button glides in after this many blooms…
  bouquetAfterSec: 25,     // …or this many seconds after the first bloom (min 4 blooms)
  maxFlowers: 24,          // past this, the oldest flower fades away gracefully
};
// ══════════════════════════════════════════════════════════

(function () {
'use strict';

/* ══ ENVIRONMENT ════════════════════════════════════════════════════════ */
const QS = new URLSearchParams(location.search);
const STILL = QS.get('still') === '1';
const MUTE = QS.get('mute') === '1';
if (QS.get('far') === '0') CONFIG.farAway = false;
const capName = n => { n = String(n || '').trim().slice(0, 24).toLowerCase(); return n ? n.charAt(0).toUpperCase() + n.slice(1) : ''; };
if (QS.get('name')) CONFIG.herName = capName(QS.get('name')) || CONFIG.herName;
const STAGE = QS.has('s') ? Math.max(0, Math.min(4, parseInt(QS.get('s'), 10) || 0)) : null;
const STAGE_T = QS.has('t') ? parseFloat(QS.get('t')) : null;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const HER = capName(CONFIG.herName) || 'Katie';
const ME = String(CONFIG.myName || 'amit').toLowerCase();
const fill = s => String(s).replace(/\{her\}/g, HER).replace(/\{me\}/g, ME);

/* ══ HELPERS ════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out4: t => 1 - Math.pow(1 - t, 4),
  in: t => t * t * t,
  sine: t => (1 - Math.cos(Math.PI * t)) / 2,
  back: t => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  bounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },
};
// smooth-start underdamped spring step: 0 → ~1.14 (at u≈.39) → settles by u≈1
function spring(u) {
  if (u <= 0) return 0; if (u >= 1.3) return 1;
  const e = Math.exp(-5 * u); return 1 - e * (Math.cos(8 * u) + 0.625 * Math.sin(8 * u));
}
// softer spring (less overshoot) for big things
function spring2(u) {
  if (u <= 0) return 0; if (u >= 1.3) return 1;
  const e = Math.exp(-6.5 * u); return 1 - e * (Math.cos(7 * u) + 0.93 * Math.sin(7 * u));
}
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RNG = Math.random;              // swapped for a seeded rng while building ?s= states
const rnd = (a, b) => a + RNG() * (b - a);
const pick = a => a[(RNG() * a.length) | 0];
const hex = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a) => (a === undefined || a >= 1)
  ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'
  : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(3) + ')';

/* ══ DOM ════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const body = document.body;
const cv = $('cv');
const ctx = cv.getContext && cv.getContext('2d');
const introEl = $('intro'), hiEl = $('hi'), subEl = $('sub');
const hintEl = $('hint'), hintTxt = $('hintTxt');
const bqBtn = $('bq'), bqTxt = $('bqTxt');
const noteEl = $('note'), noteLines = $('noteLines'), againBtn = $('again');
const muteBtn = $('mute');

if (!ctx) {   // no canvas at all: a pretty static card with the message
  const fb = $('fallback'); fb.hidden = false;
  fb.innerHTML = (CONFIG.farAway ? CONFIG.finalFar : CONFIG.finalNear).map(l => '<div>' + fill(l) + '</div>').join('');
  $('ui').hidden = true; cv.hidden = true;
  return;
}


/* ══ SOUND — all synthesized ════════════════════════════════════════════
   master → compressor → out, plus a synthesized-impulse reverb bus. every
   voice has a soft attack and a filtered body; nothing is harsh. the context
   is created inside the first gesture (iOS), and every voice is a no-op until
   then — so the piece works silently too. */
const AU = (function () {
  let ac = null, master = null, verbIn = null, noise = null, muted = MUTE, started = false;
  const now = () => (ac ? ac.currentTime : 0);
  const ok = () => started && !muted && ac && ac.state === 'running';

  function impulse(sec, decay) {
    const rate = ac.sampleRate, len = Math.floor(rate * sec), b = ac.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        lp += ((Math.random() * 2 - 1) - lp) * (0.12 + 0.55 * (1 - t));   // darker as it decays
        d[i] = lp * Math.pow(1 - t, decay) * Math.min(1, i / (rate * 0.006));
      }
    }
    return b;
  }
  function makeNoise(sec) {
    const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 22; comp.ratio.value = 3.2;
    comp.attack.value = 0.005; comp.release.value = 0.3;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.92;
    master.connect(comp); comp.connect(ac.destination);
    const verb = ac.createConvolver(); verb.buffer = impulse(3.4, 2.4);
    const pre = ac.createDelay(0.2); pre.delayTime.value = 0.028;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5600;
    const vg = ac.createGain(); vg.gain.value = 0.62;
    pre.connect(verb); verb.connect(tone); tone.connect(vg); vg.connect(master);
    verbIn = pre;
    noise = makeNoise(2.6);
    const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
    if (ac.state !== 'running') ac.resume().catch(() => {});
    started = true;
    wind();
  }
  // an input node routed to master (dry, panned) and to the reverb (wet)
  function bus(pan, dry, wet, vol) {
    const g = ac.createGain(); g.gain.value = vol == null ? 1 : vol;
    let n = g;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); g.connect(p); n = p; }
    const d = ac.createGain(); d.gain.value = dry; n.connect(d); d.connect(master);
    if (wet > 0) { const w = ac.createGain(); w.gain.value = wet; n.connect(w); w.connect(verbIn); }
    return g;
  }
  function osc(type, f, t, amp, dec, dest, att) {
    const o = ac.createOscillator(), g = ac.createGain(); att = att || 0.004;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + att);

/* ══ STAGE: sizes, the painted dawn, grass, pollen ══════════════════════

  gr.addColorStop(0.9, '#fde2d8'); gr.addColorStop(1, '#fde8da');

  gr.addColorStop(0.18, 'rgba(255,232,214,.5)'); gr.addColorStop(0.45, 'rgba(255,220,214,.16)'); gr.addColorStop(1, 'rgba(255,214,220,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  for (const c of cl) {

    g.save(); g.translate(cx, cy); g.scale(1, 0.2);

}

/* — wind: one shared breeze, with slow gusts — */

/* — living grass blades (drawn interleaved with flowers, by depth) — */

  if (phase === 'intro' && !STILL && STAGE === null && tG - lastInput > 4.2 && tG - lastNudge > 3.8) {
    lastNudge = tG; nudgeHint();
    ghost = { x: W * rnd(0.35, 0.65), y: lerp(HOR, LH, 0.66), t: tG };
  }
  if (ptr.down && (phase === 'intro' || phase === 'garden') && tG - ptr.still > 0.85 && !BF.some(b => b.mode === 'finger' || b.mode === 'hover')) {
    let best = null, bd = 1e9;
    for (const b of BF) { const d = Math.hypot(b.x - ptr.x, b.y - ptr.y); if (d < bd) { bd = d; best = b; } }
    if (best) { best.mode = 'finger'; best.tgt = null; best.until = tG + 10; }
  }
}
function drawGhost(c) {
  if (!ghost || phase !== 'intro') return;
  const t = tG - ghost.t;
  if (t > 2) return;
  for (let k = 0; k < 2; k++) {
    const p = sat((t - 0.35 - k * 0.22) / 1.2);
    if (p <= 0 || p >= 1) continue;
    c.save(); c.translate(ghost.x, ghost.y); c.scale(1, 0.42);
    c.beginPath(); c.arc(0, 0, (8 + p * 40) * S, 0, TAU);
    c.lineWidth = 2.2 * S; c.strokeStyle = 'rgba(255,252,246,' + (0.75 * (1 - p)).toFixed(3) + ')'; c.stroke(); c.restore();
  }
  const pa = Math.sin(Math.PI * sat(t / 0.7));
  if (pa > 0) { c.globalAlpha = pa * 0.55; c.fillStyle = '#fffaf4'; c.beginPath(); c.arc(ghost.x, ghost.y - 4 * S, 9 * S * (1 - 0.2 * pa), 0, TAU); c.fill(); c.globalAlpha = 1; }
}
function drawWave(c) {
  const p = (BQ.t - BT.wave) / 2.2;
  if (p <= 0 || p >= 1) return;
  c.save(); c.translate(toX(NECK.x), toY(NECK.y + 0.4)); c.scale(1, 0.42);
  c.beginPath(); c.arc(0, 0, E.out(p) * Math.hypot(W, H), 0, TAU);
  c.lineWidth = 50 * S * (1 - p * 0.5); c.strokeStyle = 'rgba(255,249,238,' + (0.3 * (1 - p)).toFixed(3) + ')'; c.stroke();
  c.restore();
}
function draw() {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalAlpha = 1;
  c.drawImage(bgC, 0, 0, W, H);
  if (BQ.on) {
    const v = 0.3 * sat(BQ.t / 0.9) * (BQ.leaving >= 0 ? 1 - sat((tG - BQ.leaving) / 1.1) : 1);
    if (v > 0.002) { c.fillStyle = 'rgba(253,238,234,' + v.toFixed(3) + ')'; c.fillRect(0, 0, W, H); }
    for (const b of GR) drawBlade(c, b, tA);
    if (BQ.t > BT.wave) { drawWave(c); if (BQ.leaving >= 0) c.globalAlpha = 1 - sat((tG - BQ.leaving) / 1.1); drawMinis(c, BQ.t - BT.wave); c.globalAlpha = 1; }
    drawBouquet(c);
  } else {
    let gi = 0;
    for (const f of FL) { while (gi < GR.length && GR[gi].y <= f.y) drawBlade(c, GR[gi++], tA); drawFlower(c, f); }
    while (gi < GR.length) drawBlade(c, GR[gi++], tA);
    drawGhost(c);
  }
  drawPetals(c); drawGlints(c);
  for (const b of BF) drawButterfly(c, b);
  drawWords(c);
  drawMotes(c, tA);
  c.drawImage(fxC, 0, 0, W, H);
}
function frame(now) {
  raf = requestAnimationFrame(frame);
  let dt = (now - lastNow) / 1000; lastNow = now;
  if (!(dt > 0) || dt > 0.25) dt = 0.016;
  update(Math.min(dt, 0.05)); draw();
}
function start() { if (!raf) { lastNow = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); ptr.down = false; } else start(); });

/* ══ RESIZE (stable under the iOS toolbar) ══════════════════════════════ */
function resize(force) {
  const nw = Math.max(1, window.innerWidth), nh = Math.max(1, window.innerHeight), nd = Math.min(window.devicePixelRatio || 1, 2);
  if (!force && nw === W && nh === H && nd === DPR) return;
  const big = force || nw !== W || Math.abs(nh - LH) > 160 || nd !== DPR;
  const ow = W, oHOR = HOR, oLH = LH;
  W = nw; H = nh; DPR = nd;
  if (big) LH = nh;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  metrics();
  buildBG();
  if (big) {
    seedGrass(); seedMotes(); wordCache.clear();
    if (ow > 0 && !BQ.on && FL.length) {   // re-plant the same flowers, same ages, at the mapped spots
      const old = FL.splice(0, FL.length);
      for (const f of old) {
        const nf = makeFlower(f.x / ow * W, HOR + (f.y - oHOR) / Math.max(1, oLH - oHOR) * (LH - HOR), f.sp);
        nf.t0 = f.t0; nf.bloomed = f.bloomed; nf.sprouted = f.sprouted; nf.dying = f.dying; insertFlower(nf);
      }
    }
    if (BQ.on) {
      layoutBouquet(); buildCard();
      for (const f of BQ.items) if (f.bq.lifted) f.bakeAt = Math.max(1, f.bq.kB * BQ.B / (150 * f.k) * 1.04);
    }
  }
}
let rzT = 0;
const onResize = () => { clearTimeout(rzT); rzT = setTimeout(() => resize(false), 120); };
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(() => resize(true), 250));
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* ══ BOOT ═══════════════════════════════════════════════════════════════ */
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.race([Promise.all(['italic 500 22px "Cormorant Garamond"', '30px Parisienne', '500 15px Jost'].map(f => document.fonts.load(f))),
                  new Promise(r => setTimeout(r, 3000))]).catch(() => {})
  : Promise.resolve();
function boot() {
  buildSharedGrads(); paperGrads(); buildMoteSprite(); buildGlint(); buildMiniSprites();
  buildNote(); bqTxt.textContent = fill(CONFIG.bouquetBtn);
  if (MUTE) body.classList.add('muted');
  if (STILL) body.classList.add('still');
  resize(true);
  if (STAGE !== null) go(STAGE, STAGE_T);
  else { RNG = mulberry(7); resetToIntro(false); RNG = Math.random; }
  start();
  fontsReady.then(() => { wordCache.clear(); if (BQ.on) buildCard(); });
}
window.__garden = {
  go, plant: (x, y) => plant(x, y, true), bouquet: () => startBouquet(false),
  setT: t => { BQ.t = t; }, freeze: v => { BQ.frozen = !!v; },
  info: () => ({ phase, flowers: FL.length, blooms, bq: BQ.on ? +BQ.t.toFixed(2) : null, W, H, LH, S: +S.toFixed(3), B: +BQ.B.toFixed(1),
                 butterflies: BF.map(b => b.mode), words: WORDS.length, minis: MINI.length }),
};
boot();
})();
