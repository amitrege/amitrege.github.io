<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  ─────────────────────────────────────────────────────────────────────────────
  OUR YOGA TRIP  ·  "what's your yoga trip?"          a little card pull for Katie
  ─────────────────────────────────────────────────────────────────────────────
  One self-contained page. No frameworks, no build, no WebGL.
  Everything you see is hand-drawn SVG + CSS + one 2D canvas for the petals.

  URL FLAGS (for screenshots and demos — they just fast-forward the story)
    ?s=0        five cards face-down, fanned out          (idle)
    ?s=1        one card caught mid-flip                  (~64° of rotateY)
    ?s=2        the card revealed
    ?s=3        the card revealed + the invitation
    ?still=1    freezes every drift, flap and hue-shift on one seeded frame
    combine:    ?s=3&still=1
  With any ?s= flag the random number generator is seeded, so the same card and
  the same persona come up every time — screenshots stay comparable.
  ─────────────────────────────────────────────────────────────────────────────
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c9410f">
<title>what's your yoga trip?</title>
<meta name="description" content="Pick a card, find out what kind of yoga trip you are. Then come to the real one — OUR YOGA TRIP, Vol. 1, September 27.">
<meta property="og:title" content="what's your yoga trip?">
<meta property="og:description" content="Pick one. Don't overthink it. Then come find out in person — OUR YOGA TRIP, Vol. 1, September 27.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.92em' font-size='92'%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Shrikhand&family=Baloo+2:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* ══ palette, straight off the poster ══════════════════════════════════════ */
:root{
  --hot:#d55716; --red:#d43b08; --lime:#aab839; --gold:#e8c959; --wgold:#dfb049;
  --lorange:#e47d40; --leaf:#488252; --maroon:#713024; --brown:#77491c;
  --teal:#1f6b63; --teal2:#2f8f7a; --magenta:#e0559a; --pink:#f2a7cf;
  --cream:#f7e5bd; --ink:#5a1f14;

  /* the card's true (revealed) size — capped so the invitation has room,
     floored so it never collapses on a short screen (the page scrolls instead) */
  --ch:max(292px, min(430px, calc(100dvh - 404px), 106vw));
  --cw:calc(var(--ch) / 1.4);
  --fs:.48;          /* how small a card sits in the fan */
  --fanDx:52;        /* px between neighbouring cards — also the tap target */
  --fanRot:5.5;      /* degrees of tilt per step */
  --fanDip:7;        /* how far the outer cards sag, px */
  --fanY:-28px;      /* nudges the whole fan up or down inside the stage */
  --titleMax:118px;
  --gap:0px; --invW:0px;   /* wide-screen two-column metrics, off by default */
}
@media (max-height:730px){ :root{ --titleMax:92px } }
@media (max-width:361px){ :root{ --fs:.40; --fanDx:47 } }
/* ── wide screens ──────────────────────────────────────────────────────────
   the phone has to trade card size against spread; a desktop doesn't. so the
   card's true size (--ch, used by the reveal) is set for the payoff, and the
   fan gets its own scale (--fs) — big art AND an open arc. */
@media (min-width:900px) and (min-height:740px){
  :root{ --ch:max(324px, min(700px, calc(100dvh - 300px))); --fs:.65;
         --fanDx:340; --fanRot:7.5; --fanDip:22; --fanY:-30px; --titleMax:152px;
         --gap:clamp(46px, 4.4vw, 92px); --invW:min(500px, 30vw); }
}
@media (min-width:1100px) and (min-height:860px){ :root{ --titleMax:168px } }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;overscroll-behavior:none;
  touch-action:manipulation; background:#4a1608}
body{
  font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

/* ══ the slow psychedelic ground ═══════════════════════════════════════════ */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#c9410f}
.gl{position:absolute;inset:-22%;will-change:transform,opacity}
.g1{
  background:
    radial-gradient(58% 44% at 50% 30%, #f2d45e 0%, #e8a832 34%, rgba(232,168,50,0) 72%),
    radial-gradient(120% 90% at 50% 108%, #8e2a10 0%, rgba(142,42,16,0) 62%),
    linear-gradient(168deg,#d55716 0%,#d43b08 46%,#8d2b0e 100%);
  animation:sway 54s ease-in-out infinite;
}
/* the poster isn't one orange wash — it has lime in the border, turquoise water,
   leaf green in the lily pads and magenta in the lotus. those live here, as pools
   of colour sitting *on top of* the vignette, so the edges stay chromatic instead
   of going brown. they're all lighter than the red, which is what makes them
   vibrate against it rather than mix into mud. */
.g2{
  inset:0;      /* viewport-relative, so the pools land exactly where they're aimed */
  background:
    radial-gradient(46% 36% at 0% 94%, rgba(205,222,96,1) 0%, rgba(186,206,74,.82) 32%,
                    rgba(170,184,57,.3) 58%, rgba(170,184,57,0) 76%),
    radial-gradient(44% 36% at 100% 0%, rgba(74,192,166,1) 0%, rgba(47,143,122,.72) 34%,
                    rgba(47,143,122,.2) 60%, rgba(47,143,122,0) 78%),
    radial-gradient(32% 27% at -3% 33%, rgba(243,120,182,.92) 0%, rgba(224,85,154,.38) 42%,
                    rgba(224,85,154,0) 70%),
    radial-gradient(30% 25% at 103% 68%, rgba(243,120,182,.78) 0%, rgba(224,85,154,.26) 42%,
                    rgba(224,85,154,0) 72%),
    radial-gradient(28% 23% at 7% -3%, rgba(205,222,96,.78) 0%, rgba(198,217,90,.2) 46%,
                    rgba(198,217,90,0) 72%),
    radial-gradient(32% 25% at 97% 100%, rgba(120,196,120,.72) 0%, rgba(72,130,82,.22) 44%,
                    rgba(72,130,82,0) 74%);
  opacity:.92; animation:breathe 39s ease-in-out infinite;
}
.g3{
  background:
    repeating-radial-gradient(circle at 50% 42%, rgba(255,240,180,.12) 0 3px, rgba(0,0,0,0) 3px 22px),
    repeating-conic-gradient(from 0deg at 50% 42%, rgba(170,184,57,.11) 0deg 4deg, rgba(0,0,0,0) 4deg 8deg);
  opacity:.55; animation:spin 220s linear infinite;
}
/* the water the lotus sits in, along the bottom edge */
.g4{position:absolute;inset:0;
  background:
    radial-gradient(124% 26% at 50% 107%, rgba(84,204,178,.92) 0%, rgba(47,143,122,.52) 40%,
                    rgba(47,143,122,0) 74%),
    linear-gradient(0deg, rgba(31,107,99,.42) 0%, rgba(47,143,122,.18) 9%, rgba(47,143,122,0) 21%);
}
.vig{position:absolute;inset:0;
  background:radial-gradient(88% 66% at 50% 45%, rgba(0,0,0,0) 48%, rgba(120,38,12,.34) 78%, rgba(74,22,8,.5) 100%)}
/* wide screens only: when the card turns over, the middle of the room dims a
   little so the parchment and the invitation carry the light */
.spot{position:absolute;inset:0;opacity:0;display:none;
  transition:opacity 1.1s ease .15s;
  background:radial-gradient(58% 74% at 50% 52%, rgba(78,20,6,.5) 0%, rgba(78,20,6,.38) 42%,
                             rgba(78,20,6,.14) 72%, rgba(78,20,6,0) 92%)}
@media (min-width:900px) and (min-height:740px){ .spot{display:block} }
@keyframes sway{0%,100%{transform:translate3d(0,0,0) scale(1.02)}50%{transform:translate3d(-2.5%,1.8%,0) scale(1.09) }}
@keyframes breathe{0%,100%{opacity:.84;transform:translate3d(1.2%,-.7%,0) scale(1.03)}50%{opacity:.98;transform:translate3d(-1.2%,1.2%,0) scale(1.09)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ the poster's border, on screens big enough to hold one ════════════════ */
#frame{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
@media (min-width:900px){
  #frame{display:block;border:15px solid transparent;
    border-image:linear-gradient(148deg,#c6d95a 0%,#aab839 15%,#488252 30%,#1f6b63 44%,
                                 #2f8f7a 55%,#e0559a 72%,#e8c959 88%,#aab839 100%) 1;}
  #frame::before{content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 0 2px rgba(90,31,20,.6), inset 0 0 0 5px rgba(255,225,150,.42),
               inset 0 0 0 6.5px rgba(31,107,99,.5), inset 0 0 26px 4px rgba(74,22,8,.26)}
}

#fx{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ══ layout ════════════════════════════════════════════════════════════════ */
.shell{
  position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px)
          calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px);
}
header{flex:0 0 auto;width:100%;max-width:640px;text-align:center;
  transition:transform .7s cubic-bezier(.2,.85,.25,1), opacity .5s ease}
#title{display:block;width:100%;max-width:min(560px,100%);margin:0 auto;height:auto;
  max-height:var(--titleMax);overflow:visible}
.sub{margin:-2px 0 0;font-size:clamp(13px,3.6vw,17px);font-weight:500;letter-spacing:.02em;
  color:#fff3d0;text-shadow:0 1px 0 rgba(113,48,36,.85), 0 2px 7px rgba(74,22,8,.5);
  transition:opacity .45s ease, transform .55s cubic-bezier(.2,.85,.25,1)}
/* once a card is chosen the instruction has done its job — it goes, completely */
.st-reveal .sub{opacity:0;transform:translateY(-7px)}
.moons{display:block;width:min(268px,64vw);height:auto;margin:5px auto 0;opacity:.9;overflow:hidden;
  transition:max-height .55s ease, opacity .4s ease, margin-top .55s ease;max-height:26px}
.st-reveal .moons{max-height:0;opacity:0;margin-top:0}
.st-reveal header{transform:scale(.92) translateY(-2px)}
@media (min-width:900px) and (min-height:740px){ .st-reveal header{transform:scale(1) translateY(0)} }

.stage{flex:1 1 auto;position:relative;width:100%;min-height:calc(var(--ch) + 18px);
  display:flex;align-items:center;justify-content:center}
/* the halo is a square that spins, so it lives in a clip box — a rotated square
   would otherwise widen the page's scrollable area on a phone */
.haloWrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.halo{--hs:min(calc(var(--cw) * 2.6), 96%);
  position:absolute;left:calc(50% + var(--pickX,0px));top:50%;width:var(--hs);height:var(--hs);
  margin:calc(var(--hs) / -2) 0 0 calc(var(--hs) / -2);border-radius:50%;
  opacity:.34;transition:opacity 1s ease .2s, left .78s cubic-bezier(.22,.9,.26,1);pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 12%,rgba(0,0,0,.55) 52%,transparent 80%);
          mask-image:radial-gradient(closest-side,#000 12%,rgba(0,0,0,.55) 52%,transparent 80%);
  background:
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,236,168,.34) 0deg 2.6deg, rgba(255,236,168,0) 2.6deg 8deg),
    radial-gradient(closest-side, rgba(255,208,110,.34), rgba(255,208,110,0) 72%);
  animation:spin 66s linear infinite;
}
.st-reveal .halo{opacity:.6}

footer{flex:0 0 auto;width:100%;max-width:560px;text-align:center}
.slot{position:relative;height:54px;display:flex;align-items:center;justify-content:center;
  transition:transform .7s cubic-bezier(.2,.85,.25,1)}
/* on a phone the idle fan leaves a lot of air below it — the hint comes up to meet it */
@media (max-width:899px){ body:not(.st-reveal) .slot{transform:translateY(-42px)} }
#hint,#again{position:absolute;transition:opacity .4s ease, transform .4s ease}
#hint{font-size:clamp(12.5px,3.3vw,15px);font-weight:500;color:#ffe9b8;letter-spacing:.03em;
  text-shadow:0 1px 0 rgba(113,48,36,.9), 0 2px 8px rgba(74,22,8,.45)}
#again{
  min-height:46px;min-width:168px;padding:9px 26px 11px;
  font-family:"Shrikhand","Baloo 2",Georgia,serif;font-size:17px;letter-spacing:.015em;
  color:#5a1f14;background:linear-gradient(178deg,#ffdf7e,#e8a832 52%,#d55716);
  border-radius:44px 44px 46px 46px/ 40px 40px 44px 44px;
  box-shadow:inset 0 2px 0 rgba(255,247,214,.85), inset 0 -3px 0 rgba(113,48,36,.35),
             0 0 0 2.5px #713024, 0 0 0 5px rgba(255,225,150,.55), 0 8px 20px rgba(74,22,8,.45);
  opacity:0;transform:translateY(9px) scale(.94);pointer-events:none;
}
#again:active{transform:translateY(2px) scale(.985)}
#again:focus-visible,.card:focus-visible{outline:3px dashed #fff2c6;outline-offset:5px}
.st-reveal #hint{opacity:0;transform:translateY(-8px)}
.st-reveal #again{opacity:1;transform:none;pointer-events:auto}
.st-flip #hint{opacity:0}

#invite{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .8s cubic-bezier(.2,.85,.25,1), opacity .6s ease}
#invite>.iw{overflow:hidden;min-height:0}
.st-invite #invite{grid-template-rows:1fr;opacity:1}
.inv{padding:12px 14px 2px;color:#fff2cf}
.inv .ttl{font-family:"Bagel Fat One","Baloo 2",cursive;font-size:clamp(14.5px,4.2vw,21px);
  letter-spacing:.01em;color:#ffe07a;line-height:1.18;text-wrap:balance;
  text-shadow:0 2px 0 #7c2405, 0 3px 12px rgba(74,22,8,.7)}
.inv .ttl b{color:#fff6da;font-weight:400}
.inv .cre{margin:3px 0 7px;font-size:clamp(11px,3.1vw,13.5px);font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#c8e07a;text-shadow:0 1px 0 rgba(74,22,8,.9)}
.inv .msg{margin:0 auto;max-width:44ch;font-size:clamp(12.5px,3.35vw,15px);line-height:1.45;
  font-weight:500;color:#ffeec6;text-shadow:0 1px 3px rgba(74,22,8,.6)}
.inv .sig{display:block;margin-top:4px;font-family:"Shrikhand","Baloo 2",serif;
  font-size:clamp(13px,3.6vw,16px);color:#ffd166;letter-spacing:.01em}
.divlotus{display:block;margin:7px auto 0;width:74px;height:15px;opacity:.9}

/* ══ the cards ═════════════════════════════════════════════════════════════ */
.card{
  position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);
  margin-left:calc(var(--cw) / -2);margin-top:calc(var(--ch) / -2);
  padding:0;border:0;background:none;perspective:1500px;
  transform-origin:50% 50%;will-change:transform,opacity;
  transition:transform .78s cubic-bezier(.22,.9,.26,1), opacity .6s ease, filter .6s ease;
  touch-action:manipulation;
}
.cardIn{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.36,.9,.28,1);will-change:transform}
.card.flipped .cardIn{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;overflow:hidden;
  box-shadow:0 10px 26px rgba(58,14,4,.5), 0 2px 6px rgba(58,14,4,.35)}
.face.back{transform:rotateY(180deg)}
.card .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.card.dim{opacity:.16;filter:blur(2.5px) saturate(.55)}
.card.gone{opacity:0}
@media (hover:hover){
  .st-idle .card:hover{transform:var(--tf) translateY(-16px) !important;z-index:9}
}
.card.press .cardIn{transform:scale(.965)}

/* the revealed side ─ parchment card face */
.rvwrap{position:absolute;inset:0;overflow:hidden;
  --f1:#c9410f; --f2:#d59a30; --f3:#a8532a;
  background:
    radial-gradient(122% 92% at 50% 6%, #fff5d8 0%, #f9e8c3 44%, #f0d49c 100%)}
.rvwrap::before{content:"";position:absolute;left:50%;top:44%;width:190%;height:190%;
  transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    var(--acc,#c9410f) 0deg 2.2deg, rgba(0,0,0,0) 2.2deg 7deg);
  opacity:.055}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;overflow:hidden;
  padding:8.5% 8% 8%;font-size:calc(var(--k,1) * 1em)}
.rv .emb{width:2.9em;height:2.9em;border-radius:50%;margin-bottom:.34em;flex:0 0 auto;
  background:radial-gradient(closest-side,#fff6df,#f2ddac);
  box-shadow:0 0 0 .1em var(--f2), 0 0 0 .18em rgba(201,65,15,.55), 0 1px 3px rgba(113,48,36,.3);
  overflow:hidden;position:relative}
.rv .emb svg{position:absolute;left:-16%;top:-16%;width:132%;height:132%}
.rv .top{font-size:.66em;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:#b0632c;margin-bottom:.3em}
.rv .nm{font-family:"Shrikhand","Baloo 2",Georgia,serif;font-weight:400;
  font-size:1.28em;line-height:1.1;letter-spacing:.004em;color:#8e2410;
  text-shadow:0 1.5px 0 rgba(255,250,226,.95), 0 2.5px 0 rgba(197,96,40,.26);
  margin:0;text-wrap:balance}
.rv .vibe{margin-top:.4em;font-size:.76em;font-weight:500;font-style:italic;color:#9a6134;
  line-height:1.3;text-wrap:balance}
.rv .rule{width:56%;height:.85em;margin:.5em 0 .42em;opacity:.95;flex:0 0 auto}
.rv .row{margin-top:.42em;line-height:1.28}
.rv .lab{display:block;font-size:.6em;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:#bd7430}
.rv .val{display:block;font-size:.93em;font-weight:500;color:#5a1f14;text-wrap:balance}
.rv .foot{margin-top:.7em;font-size:.53em;font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;color:#c08b52}
.rvwrap .wm{position:absolute;left:50%;top:52%;width:104%;height:104%;transform:translate(-50%,-50%);
  opacity:.075;pointer-events:none;filter:saturate(.4)}
.rvfr{position:absolute;inset:0;width:100%;height:100%}

/* ══ wide screens ══════════════════════════════════════════════════════════ */
@media (min-width:900px) and (min-height:740px){
  .moons{width:min(500px,40vw);margin-top:8px}
  footer{max-width:none}
  /* keep the hint and the button clear of the poster border */
  .shell{padding-bottom:28px}
  /* a big card needs a longer lens, or the flip bulges out of its own space */
  .card{perspective:2600px}
  /* the desktop card is sized by --ch alone; the stage must not force the page
     taller than the viewport, so it simply takes what the column leaves it */
  .stage{min-height:0}
  .halo{--hs:min(calc(var(--cw) * 3), 1180px)}
  /* the payoff is a two-up composition, not a centred column: the card slides
     into the left half and the invitation is typeset beside it. --pickX carries
     the shift, so card, ghosts, halo and button all travel together. */
  body.st-invite{--pickX:calc(-.5 * (var(--gap) + var(--invW)))}
  .st-reveal .slot{transform:translateX(var(--pickX,0px))}
  .st-reveal .spot{opacity:1}
  #invite{position:absolute;z-index:22;width:var(--invW);
    left:calc(50% + var(--pickX,0px) + var(--cw) / 2 + var(--gap));
    top:calc(50% + 50px);transform:translateY(-50%);
    transition:grid-template-rows .8s cubic-bezier(.2,.85,.25,1), opacity .6s ease .12s,
               left .78s cubic-bezier(.22,.9,.26,1)}
  .inv{display:block;text-align:left;padding:0;
       text-shadow:0 1px 0 rgba(74,22,8,.7), 0 2px 10px rgba(74,22,8,.55)}
  .inv .divlotus{margin:0 0 16px;width:112px;height:23px}
  .inv .ttl{font-size:clamp(25px,2.15vw,33px);line-height:1.14;white-space:normal;letter-spacing:.005em}
  .inv .ttl .sep{display:none}
  .inv .ttl .l1{display:block;font-size:1.14em}
  .inv .ttl .l2{display:block;white-space:nowrap;font-size:.84em;margin-top:3px;color:#fff6da}
  .inv .cre{margin:11px 0 0;font-size:clamp(11.5px,.95vw,13.5px);letter-spacing:.17em;
    text-shadow:0 1px 0 rgba(74,22,8,.95), 0 0 8px rgba(74,22,8,.9), 0 2px 6px rgba(74,22,8,.7)}
  .inv .msg{margin:18px 0 0;padding:18px 0 0;max-width:38ch;line-height:1.62;
    font-size:clamp(14.5px,1.2vw,17.5px);
    border-top:1px solid rgba(255,226,150,.32);border-left:0;
    text-shadow:0 1px 2px rgba(74,22,8,.8), 0 0 12px rgba(74,22,8,.5)}
  .inv .sig{display:block;margin:12px 0 0;font-size:clamp(17px,1.4vw,21px)}
}

/* ══ reduced motion / frozen ═══════════════════════════════════════════════ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
html.still *,html.still *::before,html.still *::after{
  animation-play-state:paused !important; transition:none !important}
</style>
</head>
<body>

<div id="bg" aria-hidden="true">
  <div class="gl g1"></div><div class="vig"></div>
  <div class="gl g2"></div><div class="gl g3"></div><div class="g4"></div><div class="spot"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="frame" aria-hidden="true"></div>

<div class="shell">
  <header>
    <svg id="title" viewBox="0 0 380 152" role="img" aria-label="what's your yoga trip?">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">

/* ═══ groovy melting title, drawn as SVG so it can never overflow ══════════ */
function arcText(str, size, cy, arc, grad, stroke){
  let tsp = '', prev = 0;
  const n = str.length;
  for (let i = 0; i < n; i++){
    const t = n > 1 ? i / (n - 1) - .5 : 0;
    const y = -arc * (1 - 4 * t * t);
    const dy = y - prev; prev = y;
    const slope = arc * 8 * t / (n * 0.055 + 1);
    const rot = Math.max(-16, Math.min(16, slope * 1.5));
    const c = str[i] === ' ' ? '&#160;' : (str[i] === "'" ? '&#8217;' : str[i]);
    tsp += `<tspan dy="${S(dy)}" rotate="${S(rot,1)}">${c}</tspan>`;
  }
  return `<text x="190" y="${cy}" text-anchor="middle" font-family="'Bagel Fat One','Baloo 2',cursive"
      font-size="${size}" letter-spacing="-.012em" fill="url(#${grad})"
      stroke="${stroke}" stroke-width="${S(size*0.135)}" stroke-linejoin="round"
      paint-order="stroke fill" style="paint-order:stroke fill">${tsp}</text>`;
}

/* ═══ fan geometry ═════════════════════════════════════════════════════════ */
/* the fan: a gentle arc where the tilt is softer than the spread, so five cards
   still fit across a narrow phone without anyone's corner falling off the edge */
let geo = { dx: 50, rot: 5.5, dip: 7, s: .44, w: 130, fy: 0, push: 78, py: 100 };
function isWide(){ return innerWidth >= 1180 && innerHeight >= 740; }
function readGeo(){
  const cs2 = getComputedStyle(document.documentElement);
  geo.dx  = parseFloat(cs2.getPropertyValue('--fanDx'))  || 50;
  geo.rot = parseFloat(cs2.getPropertyValue('--fanRot')) || 5.5;
  geo.dip = parseFloat(cs2.getPropertyValue('--fanDip')) || 7;
  geo.s   = parseFloat(cs2.getPropertyValue('--fs'))     || .44;
  geo.fy  = parseFloat(cs2.getPropertyValue('--fanY'))   || 0;
  /* measure the card — --ch is a calc(), which a custom property won't resolve */
  geo.w   = (cards[0] ? cards[0].offsetWidth : 300) * geo.s;
  const wide = innerWidth >= 900 && innerHeight >= 740;
  /* neighbours never sit more than a card apart, so the arc stays an arc and
     every motif still shows — on a phone this never bites, on a desktop it does */
  if (geo.dx > geo.w * .98) geo.dx = geo.w * .98;
  /* if the spread would push a rotated card past the edge, tighten it */
  const half = (stage.clientWidth || innerWidth) / 2 - (wide ? 46 : 4);
  const rad = 2 * geo.rot * Math.PI / 180;
  const bb = (geo.w * Math.cos(rad) + geo.w * 1.4 * Math.sin(rad)) / 2;
  const maxDx = Math.max(44, (half - bb) / 2);   /* never below a 44px tap target */
  if (geo.dx > maxDx) geo.dx = maxDx;
  /* where the four you didn't pick drift to */
  geo.push = wide ? geo.w * .60 : geo.dx * 1.55;
  geo.py   = geo.w * (wide ? 1.12 : .78);
}
function fanTF(i){
  const d = i - 2;
  const y = geo.dip * (d * d) - geo.dip * 1.2 + geo.fy;
  return `translate(${S(d * geo.dx, 1)}px, ${S(y, 1)}px) rotate(${S(d * geo.rot, 2)}deg) scale(${geo.s})`;
}
function stackTF(i){
  const d = i - 2;
  return `translate(${S(d * 2.5, 1)}px, ${S(Math.abs(d) * 1.5, 1)}px) rotate(${S(d * 2.2, 1)}deg) scale(${geo.s})`;
}
/* the four you didn't pick drift back — spread evenly whichever one you took.
   they travel with --pickX so they stay tucked behind the card, not under the
   invitation, when the wide layout slides everything left */
function pushTF(i, chosen){
  const rank = i < chosen ? i : i - 1;      /* 0..3 among the leftovers */
  const d = rank - 1.5;
  return `translate(calc(var(--pickX,0px) + ${S(d * geo.push, 1)}px), ${S(geo.py, 1)}px) rotate(${S(d * geo.rot * 2.4, 1)}deg) scale(${S(geo.s * .66, 3)})`;
}
/* the chosen card sits dead centre — or, on a wide screen, in the left half */
const PICKTF = 'translate(var(--pickX,0px), 0px) rotate(0deg) scale(1)';
function setTF(el, tf){ el.style.setProperty('--tf', tf); el.style.transform = tf; }

/* ═══ state ════════════════════════════════════════════════════════════════ */
const shell = document.querySelector('.shell');
const live  = document.getElementById('live');
let deal = [];            /* {motif, trip} per card */
let lastTrip = -1;
let chosen = -1;
let busy = false;

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = (rnd() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function newDeal(){
  const motifs = shuffled(MOTIFS);
  const pool = shuffled(TRIPS.map((_, i) => i).filter(i => i !== lastTrip)).slice(0, 5);
  deal = pool.map((ti, k) => ({ trip: ti, motif: motifs[k] }));
  cards.forEach((c, i) => {
    const d = deal[i];
    c.querySelector('.mo').setAttribute('href', '#m-' + d.motif);
    applyTheme(c, d.motif);
    c.classList.remove('flipped', 'dim', 'gone', 'press');
    c.disabled = false;
    c.style.zIndex = String(5 - Math.abs(i - 2));
    c.setAttribute('aria-label', 'card ' + (i + 1) + ' of 5 — turn it over');
  });
}

function fillReveal(card, trip){
  const t = TRIPS[trip];
  card.querySelector('.nm').textContent   = t.name;
  card.querySelector('.vibe').textContent = t.vibe;
  card.querySelector('.vi').textContent   = t.intention;
  card.querySelector('.vp').textContent   = t.pose;
  card.querySelector('.foot').textContent = 'our yoga trip · ' + CONFIG.volume.toLowerCase();
  card.querySelector('.wmo').setAttribute('href', '#m-' + t.motif);
  card.querySelector('.emo').setAttribute('href', '#m-' + t.motif);
  card.querySelector('.rvwrap').style.setProperty('--acc', THEMES[t.motif].ac);
  card.setAttribute('aria-label', t.name + '. your intention: ' + t.intention + '. your pose: ' + t.pose);
}
/* shrink the type until it genuinely fits the frame — measured, not guessed */
function fitCard(card){
  const rv = card.querySelector('.rv');
  /* the type rides the card's own width, so a big desktop card is genuinely
     bigger type — not a small card's type floating in a large frame */
  const base = Math.max(11, Math.min(25, card.clientWidth * 0.058));
  rv.style.fontSize = base + 'px';
  let k = 1; rv.style.setProperty('--k', 1);
  let guard = 0;
  while ((rv.scrollHeight > rv.clientHeight + 1 || rv.scrollWidth > rv.clientWidth + 1) && k > .58 && guard++ < 30){
    k -= .035; rv.style.setProperty('--k', S(k, 3));
  }
}

function setStage(name){
  document.body.classList.remove('st-idle', 'st-flip', 'st-reveal', 'st-invite');
  if (name === 'idle')   document.body.classList.add('st-idle');
  if (name === 'flip')   document.body.classList.add('st-idle', 'st-flip');
  if (name === 'reveal') document.body.classList.add('st-reveal');
  if (name === 'invite') document.body.classList.add('st-reveal', 'st-invite');
}

function layoutIdle(){
  readGeo();
  cards.forEach((c, i) => setTF(c, fanTF(i)));
}
/* first load: the deck arrives stacked and fans itself out */
function dealIn(){
  readGeo();
  cards.forEach((c, i) => { c.style.transition = 'none'; c.disabled = true; setTF(c, stackTF(i)); });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    cards.forEach((c, i) => {
      c.style.transition = '';
      c.style.transitionDelay = (110 + i * 72) + 'ms';
      setTF(c, fanTF(i));
    });
    setTimeout(() => cards.forEach(c => { c.style.transitionDelay = ''; c.disabled = false; }), 1300);
  }));
}

/* ═══ choose a card ════════════════════════════════════════════════════════ */
function choose(i, opts){
  if (busy || chosen !== -1) return;
  opts = opts || {};
  busy = true; chosen = i;
  const card = cards[i], d = deal[i];
  fillReveal(card, d.trip);
  fitCard(card);            /* fit before the back face is ever visible */
  lastTrip = d.trip;

  setStage('flip');
  cards.forEach((c, k) => {
    c.disabled = true;
    if (k === i){ c.style.zIndex = '20'; setTF(c, PICKTF); }
    else { c.style.zIndex = '1'; setTF(c, pushTF(k, i)); c.classList.add('dim'); }
  });

  const doFlip = () => {
    card.classList.add('flipped');
    const r = card.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, Math.min(r.width, r.height) * .46);
  };
  if (opts.instant){ doFlip(); }
  else setTimeout(doFlip, FROZEN ? 0 : 250);

  const finish = () => {
    setStage('reveal');
    fitCard(card);
    card.disabled = false;
    live.textContent = TRIPS[d.trip].name + '. your intention: ' + TRIPS[d.trip].intention;
    busy = false;
    if (!opts.noInvite) setTimeout(() => { if (chosen !== -1) setStage('invite'); }, FROZEN ? 0 : 1150);
  };
  if (opts.instant || FROZEN) finish(); else setTimeout(finish, 1080);
}

/* ═══ pick again — gather, riffle, re-deal ═════════════════════════════════ */
function again(){
  if (busy) return;
  busy = true;
  const wasChosen = chosen;
  chosen = -1;
  setStage('idle');
  readGeo();
  cards.forEach((c, i) => {
    c.disabled = true; c.classList.remove('dim');
    c.querySelector('.cardIn').style.transform = '';   /* clear any ?s=1 freeze */
    c.style.zIndex = String(10 - Math.abs(i - wasChosen));
    setTF(c, stackTF(i));
  });
  cards[wasChosen] && cards[wasChosen].classList.remove('flipped');

  setTimeout(() => {                                   /* riffle */
    cards.forEach((c, i) => {
      c.style.transitionDuration = '.30s';
      setTF(c, `translate(${S((i-2)*10,1)}px, ${S(-16 - Math.abs(i-2)*5,1)}px) rotate(${S((i-2)*7,1)}deg) scale(${S(geo.s*1.06,3)})`);
    });
  }, FROZEN ? 0 : 430);

  setTimeout(() => {                                   /* deal */
    newDeal();
    cards.forEach((c, i) => {
      c.style.transitionDuration = '';
      c.style.transitionDelay = FROZEN ? '' : (i * 62) + 'ms';
      setTF(c, fanTF(i));
    });
    setTimeout(() => cards.forEach(c => { c.style.transitionDelay = ''; c.disabled = false; }), FROZEN ? 0 : 800);
    busy = false;
    live.textContent = 'five new cards, face down.';
  }, FROZEN ? 0 : 780);
}
document.getElementById('again').addEventListener('click', again);

/* ═══ input — pointer events, with a small drag guard ═════════════════════ */
let downX = 0, downY = 0, downOn = null;
stage.addEventListener('pointerdown', e => {
  const c = e.target.closest('.card');
  if (!c || c.disabled) return;
  downOn = c; downX = e.clientX; downY = e.clientY;
  c.classList.add('press');
}, { passive: true });
window.addEventListener('pointerup', e => {
  if (!downOn) return;
  const c = downOn; downOn = null;
  c.classList.remove('press');
  if (c.disabled) return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 14) return;
  if (e.target.closest('.card') !== c) return;
  choose(+c.dataset.i);
}, { passive: true });
window.addEventListener('pointercancel', () => { if (downOn){ downOn.classList.remove('press'); downOn = null; } });
stage.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest('.card');
  if (!c || c.disabled) return;
  e.preventDefault(); choose(+c.dataset.i);
});

/* ═══ petals + butterflies, one canvas, no per-frame allocation ═══════════ */
const cv = document.getElementById('fx'), ctx = cv.getContext('2d', { alpha: true });
let W = 0, H = 0, DPR = 1;
const PET = ['#f2a7cf', '#e0559a', '#e8c959', '#d55716', '#aab839', '#e47d40', '#dfb049'];
const N_AMB = 34, N_BUT = 5, N_BURST = 40, N = N_AMB + N_BUT + N_BURST;
const p = [];
for (let i = 0; i < N; i++) p.push({ x:0, y:0, vx:0, vy:0, r:0, vr:0, s:0, a:0, c:'#fff', life:0, kind:0, ph:0, sw:0 });

function resetAmb(o, seedTop){
  o.kind = 0;
  o.x = rr(-40, W + 40);
  o.y = seedTop ? rr(-60, -10) : rr(-40, H + 40);
  o.s = rr(6.5, 15) * (W < 520 ? .88 : 1);
  o.vx = rr(-.16, .30); o.vy = rr(.13, .42);
  o.r = rr(0, 6.283); o.vr = rr(-.012, .012);
  o.a = rr(.42, .84); o.c = PET[(rnd() * PET.length) | 0];
  o.ph = rr(0, 6.283); o.sw = rr(.22, .62);
}
function resetBut(o){
  o.kind = 1;
  o.x = rr(-40, W + 40); o.y = rr(-40, H + 40);
  o.s = rr(11, 18) * (W < 520 ? .85 : 1);
  o.vx = rr(-.34, .34) || .2; o.vy = rr(-.19, .19);
  o.r = 0; o.a = rr(.62, .9); o.ph = rr(0, 6.283);
  o.c = rnd() < .5 ? '#d55716' : '#e47d40'; o.sw = rr(.7, 1.25);
}
function burst(cx, cy, r0){
  if (RM) return;
  for (let i = N_AMB + N_BUT; i < N; i++){
    const o = p[i], a = ((i - N_AMB - N_BUT) / N_BURST) * 6.283 + rr(-.16, .16), sp = rr(2.4, 7.4);
    o.kind = 2; o.x = cx + Math.cos(a) * r0; o.y = cy + Math.sin(a) * r0 * .92;
    o.vx = Math.cos(a) * sp; o.vy = Math.sin(a) * sp - rr(.4, 2.2);
    o.s = rr(5, 13); o.r = rr(0, 6.283); o.vr = rr(-.16, .16);
    o.a = 1; o.life = 1; o.c = PET[(rnd() * PET.length) | 0];
  }
}
function sizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function petalPath(s){
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.bezierCurveTo(s * .78, -s * .48, s * .62, s * .58, 0, s);
  ctx.bezierCurveTo(-s * .62, s * .58, -s * .78, -s * .48, 0, -s);
  ctx.closePath();
}
function drawButterfly(s, flap, col){
  ctx.globalAlpha *= 1;
  ctx.fillStyle = col;
  ctx.save(); ctx.scale(flap, 1);
  ctx.beginPath(); ctx.ellipse(-s * .62, -s * .18, s * .70, s * .44, -0.45, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse( s * .62, -s * .18, s * .70, s * .44,  0.45, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-s * .44,  s * .40, s * .46, s * .32, -0.30, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse( s * .44,  s * .40, s * .46, s * .32,  0.30, 0, 6.283); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#3a1608';
  ctx.beginPath(); ctx.ellipse(0, s * .06, s * .11, s * .52, 0, 0, 6.283); ctx.fill();
}

let t0 = 0, raf = 0, running = false;
function frame(ts){
  raf = 0;
  const dt = t0 ? Math.min(2.6, (ts - t0) / 16.667) : 1; t0 = ts;
  step(dt); draw();
  if (running) raf = requestAnimationFrame(frame);
}
function step(dt){
  for (let i = 0; i < N; i++){
    const o = p[i];
    if (o.kind === 2){
      if (o.life <= 0) continue;
      o.vy += .085 * dt; o.vx *= (1 - .012 * dt); o.vy *= (1 - .008 * dt);
      o.x += o.vx * dt; o.y += o.vy * dt; o.r += o.vr * dt;
      o.life -= .0125 * dt; o.a = Math.max(0, o.life);
    } else if (o.kind === 1){
      o.ph += .05 * dt;
      o.x += (o.vx + Math.cos(o.ph * .55) * .32) * dt;
      o.y += (o.vy + Math.sin(o.ph * .8) * .30) * dt;
      if (o.x < -70) o.x = W + 60; else if (o.x > W + 70) o.x = -60;
      if (o.y < -70) o.y = H + 60; else if (o.y > H + 70) o.y = -60;
    } else {
      o.ph += .022 * dt;
      o.x += (o.vx + Math.sin(o.ph) * o.sw) * dt;
      o.y += o.vy * dt; o.r += o.vr * dt;
      if (o.y > H + 50){ o.y = -40; o.x = rr(-30, W + 30); }
      if (o.x < -60) o.x = W + 50; else if (o.x > W + 60) o.x = -50;
    }
  }
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < N; i++){
    const o = p[i];
    if (o.kind === 2 && o.life <= 0) continue;
    if (o.a <= .004) continue;
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.globalAlpha = o.a;
    if (o.kind === 1){
      ctx.rotate(Math.sin(o.ph * .5) * .28);
      drawButterfly(o.s, .42 + .58 * Math.abs(Math.cos(o.ph * 1.9)), o.c);
    } else {
      ctx.rotate(o.r);
      ctx.scale(1, .74 + .26 * Math.abs(Math.cos(o.r * .8)));
      ctx.fillStyle = o.c; petalPath(o.s); ctx.fill();
      ctx.globalAlpha = o.a * .5; ctx.strokeStyle = 'rgba(113,48,36,.75)';
      ctx.lineWidth = Math.max(.6, o.s * .10); ctx.stroke();
    }
    ctx.restore();
  }
}
function startFx(){ if (running || FROZEN) return; running = true; t0 = 0; if (!raf) raf = requestAnimationFrame(frame); }
function stopFx(){ running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { document.hidden ? stopFx() : startFx(); });

function seedParticles(){
  for (let i = 0; i < N_AMB; i++) resetAmb(p[i], false);
  for (let i = N_AMB; i < N_AMB + N_BUT; i++) resetBut(p[i]);
  for (let i = N_AMB + N_BUT; i < N; i++){ p[i].kind = 2; p[i].life = 0; p[i].a = 0; }
}

/* ═══ boot ════════════════════════════════════════════════════════════════ */
const nb = s => String(s).replace(/ /g, ' ');   /* keep "September 27" together */
/* one line on a phone; on a wide screen the two spans stack into a proper
   masthead (the middle "·" steps aside) — same words either way */
document.getElementById('invTtl').innerHTML =
  '<span class="l1">' + nb('OUR YOGA TRIP') + '</span> <b class="sep">·</b> ' +
  '<span class="l2">' + nb(CONFIG.volume) + ' <b>·</b> ' + nb(CONFIG.eventDate) + '</span>';
document.getElementById('invMsg').innerHTML =
  'the cards are only for fun. the real thing has a room full of people who are ' +
  'genuinely glad you came, nobody checking whether you can touch your toes, ' +
  'and a mat with your name on it. come and find your trip in person — bring a friend.' +
  '<span class="sig">— ' + CONFIG.herName.toLowerCase() + ' x</span>';

sizeCanvas(); seedParticles();
readGeo(); newDeal(); setStage('idle');
if (STAGE === null && !FROZEN) dealIn(); else layoutIdle();

let rt = 0;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    sizeCanvas(); readGeo();
    if (chosen === -1) layoutIdle();
    else cards.forEach((c, i) => setTF(c, i === chosen ? PICKTF : pushTF(i, chosen)));
    if (chosen !== -1) fitCard(cards[chosen]);
    fitTitle();
    if (!running) draw();          /* the canvas was just cleared by the resize */
  }, 140);
});

function ready(){
  fitTitle();
  if (chosen !== -1) fitCard(cards[chosen]);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ready); else setTimeout(ready, 300);
setTimeout(ready, 1200);

/* fast-forward flags */
if (STAGE !== null){
  cards.forEach(c => { c.style.transition = 'none'; c.querySelector('.cardIn').style.transition = 'none'; });
  if (STAGE >= 1){
    const i = 2, card = cards[i];
    if (STAGE === 1){
      chosen = i; setStage('flip');
      fillReveal(card, deal[i].trip);
      cards.forEach((c, k) => {
        if (k === i){ c.style.zIndex = '20'; setTF(c, PICKTF); }
        else { c.style.zIndex = '1'; setTF(c, pushTF(k, i)); c.classList.add('dim'); }
      });
      card.querySelector('.cardIn').style.transform = 'rotateY(64deg)';
      const r = card.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, Math.min(r.width, r.height) * .46);
      for (let k = 0; k < 26; k++) step(1);
    } else {
      choose(i, { instant: true, noInvite: true });
      if (STAGE >= 3) setStage('invite');
      for (let k = 0; k < 34; k++) step(1);
    }
  }
  requestAnimationFrame(() => { cards.forEach(c => { c.style.transition = ''; c.querySelector('.cardIn').style.transition = ''; }); });
}

if (FROZEN){ draw(); }
else { startFx(); }
if (RM && !STILL){ /* static, but keep it pretty */ draw(); }
</script>
</body>
</html>
